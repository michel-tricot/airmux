    Scope:
      type: string
      enum:
      - inference-keys:read
      - inference-keys:write
      - workspaces:read
      - workspaces:create
      - workspaces:write
      - workspaces:delete
      - bundles:read
      - bundles:write
      - events:read
      - data-planes:read
      - provider-credentials:read
      - provider-credentials:write
      - taxonomy:read
      - taxonomy:write
      - orgs:read
      - orgs:create
      - orgs:write
      - orgs:delete
      - users:read
      - users:write
      - activity:read
      - management-keys:read
      - management-keys:write
      - instance-keys:read
      - instance-keys:write
      - sync
      title: Scope
      description: 'What a management credential may do; org and instance row-scoping are a separate axis.


        A scope restricts the credential, never expands it: a token minted without scopes carries the

        owning user''s full authority, an explicit list is a restriction that also excludes scopes

        invented later. Roles arrive later as named bundles over these same values.


        Orgs and workspaces split their lifecycle three ways because founding a tenant and destroying

        one with everything inside it are each a different privilege from governing one day to day:

        :create founds, :write governs, :delete destroys. Elsewhere :write still covers all three.'
    SecretPurpose:
      type: string
      enum:
      - provider
      title: SecretPurpose
      description: 'What family a secret belongs to. Both planes must agree, which is why it lives here.


        A new purpose is one member, and every store keeps it apart from the others without changing.'
    SecretRef:
      properties:
        purpose:
          $ref: '#/components/schemas/SecretPurpose'
        service:
          type: string
          title: Service
        name:
          type: string
          title: Name
        secret_id:
          type: string
          format: uuid
          title: Secret Id
        org_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Org Id
        workspace_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Workspace Id
      type: object
      required:
      - purpose
      - service
      - name
      - secret_id
      title: SecretRef
      description: 'Which secret, said in terms of the domain rather than of any store''s layout.


        purpose is the family, service is what inside that family the secret authenticates to (a

        provider name today), and name is the caller-facing handle that lets one service hold several.

        secret_id is what actually makes a ref unique; the rest is carried so a store with somewhere

        legible to put it can.


        org_id and workspace_id are absent for a platform secret and org_id alone is present for an org

        one, so the same two fields express all three scopes.'
    ServiceAccountIn:
      properties:
        name:
          type: string
          title: Name
          description: Service account name; the email is derived as name-<id>@airbytesvcaccount.ai
      type: object
      required:
