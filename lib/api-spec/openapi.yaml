      operationId: create_provider
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_ProviderOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Authentication failed
        '403':
          description: The credential does not have the required permission
      security:
      - ManagementKey: []
      - SessionCookie: []
      x-airmux-authority:
      - scope: instance_scope
        anyOf:
        - catalog.manage
  /api/v1/instance/taxonomy/models:
    post:
      tags:
      - Instance Model Catalog
      summary: Create or Update Model
      description: 'Create a model or replace the catalog entry with the same name.


        Required permission: `catalog.manage`.'
      operationId: create_model
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_ModelOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Authentication failed
        '403':
          description: The credential does not have the required permission
      security:
      - ManagementKey: []
      - SessionCookie: []
      x-airmux-authority:
      - scope: instance_scope
        anyOf:
        - catalog.manage
components:
