tags:
- name: Orgs
  description: Tenants of the instance; every key, bundle and event belongs to one org
- name: Users
  description: Instance admins, org members and service accounts, with their org memberships
- name: Instance Management Keys
  description: Instance-wide oversight of every org's management keys
  x-displayName: Org Management Keys
- name: Instance Keys
  description: Admin-held bearer keys for the instance endpoints, and the credential a data plane carries
- name: Data Plane
  description: 'Data-plane-facing endpoints: bundle polling, event ingestion, heartbeats'
- name: OSS
  description: 'Self-hosted bootstrap: whether this deployment has a claimed account yet, and the quickstart trapdoor'
- name: Management Keys
  description: User-bound bearer keys for one org; instance reach is a separate key type
- name: Org Users
  description: 'Membership in the acting org: who belongs to it, and adding or removing them'
  x-displayName: Users
- name: Workspaces
  description: Scopes inside an org where inference keys live; members are drawn from the org
- name: Inference Keys
  description: 'Caller credentials for the gateway: opaque keys whose hashes reach data planes through bundles'
- name: Auth
  description: 'Human login: password, cookie sessions, account endpoints, CLI device authorization'
- name: Enrollment
  description: 'A user''s path into orgs: their standing and their one self-serve personal org'
- name: Bundles
  description: Signed policy bundles compiled per org and polled by data planes
- name: Events
  description: Usage events reported by data planes
- name: Taxonomy
  description: 'The models catalog: providers and models compiled into bundles'
- name: Provider Credentials
  description: Provider API keys an org or workspace brings; values live in the secret store, never here
- name: Activity
  description: The audit trail of writes, per org and instance-wide
