      title: Envelope[BundleOut]
    Envelope_ClaimOut_:
      properties:
        data:
          $ref: '#/components/schemas/ClaimOut'
      type: object
      required:
      - data
      title: Envelope[ClaimOut]
    Envelope_CliAuthApprovedOut_:
      properties:
        data:
          $ref: '#/components/schemas/CliAuthApprovedOut'
      type: object
      required:
      - data
      title: Envelope[CliAuthApprovedOut]
    Envelope_CliAuthPollOut_:
      properties:
        data:
          $ref: '#/components/schemas/CliAuthPollOut'
      type: object
