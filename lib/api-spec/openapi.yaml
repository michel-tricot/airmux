components:
  schemas:
    ActivityOut:
      properties:
        id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Id
        table_name:
          type: string
          title: Table Name
        record_id:
          type: string
          title: Record Id
        action:
          type: string
          title: Action
        user_id:
          type: string
          title: User Id
        occurred_at:
          type: string
          format: date-time
          title: Occurred At
      type: object
      required:
      - id
      - table_name
      - record_id
      - action
      - user_id
      - occurred_at
      title: ActivityOut
      description: 'One entry in the feed: what changed, who changed it, when. Never the snapshots themselves.


        id mirrors the column, which the sequence fills: nullable in the table, never null once read.'
    BundleOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        org_id:
          type: string
          format: uuid
          title: Org Id
        version:
          type: integer
          title: Version
        issued_at:
          type: string
          format: date-time
          title: Issued At
        expires_at:
          type: string
          format: date-time
          title: Expires At
        signing_key_id:
          type: string
          title: Signing Key Id
      type: object
      required:
      - id
      - org_id
      - version
      - issued_at
      - expires_at
      - signing_key_id
      title: BundleOut
    BundleV1:
      properties:
        schema_version:
          type: integer
          const: 1
          title: Schema Version
          default: 1
        bundle_id:
          type: string
          format: uuid
          title: Bundle Id
        org_id:
          type: string
          format: uuid
          title: Org Id
        issued_at:
          type: string
          format: date-time
          title: Issued At
        expires_at:
          type: string
          format: date-time
          title: Expires At
        keys:
          items:
            $ref: '#/components/schemas/KeyEntry'
          type: array
          title: Keys
        catalog:
          $ref: '#/components/schemas/Catalog'
      type: object
      required:
      - bundle_id
      - org_id
      - issued_at
      - expires_at
      - keys
      - catalog
      title: BundleV1
      description: 'The complete policy snapshot one data plane needs to serve requests with no database.


        Compiled by the control plane as a pure function of database state, signed, and polled

        by the data plane. If a feature seems to need a DB read on the request path, the bundle

        is missing a field; add the field here instead.'
    Catalog:
      properties:
        providers:
          items:
            $ref: '#/components/schemas/ProviderEntry'
          type: array
          title: Providers
        models:
          items:
            $ref: '#/components/schemas/ModelEntry'
          type: array
          title: Models
        credentials:
          items:
            $ref: '#/components/schemas/CredentialEntry'
          type: array
          title: Credentials
          default: []
      type: object
      required:
      - providers
      - models
      title: Catalog
      description: 'Everything routable in one org: providers, the models that point at them, and the credentials

        they are reached with.'
    ClaimOut:
      properties:
        claimed:
          type: boolean
          title: Claimed
      type: object
      required:
      - claimed
      title: ClaimOut
    CliAuthApproveIn:
      properties:
        user_code:
          type: string
          title: User Code
        org_id:
          type: string
          format: uuid
          title: Org Id
      type: object
      required:
      - user_code
      - org_id
      title: CliAuthApproveIn
    CliAuthApprovedOut:
      properties:
        status:
          type: string
          const: approved
          title: Status
        client_name:
          type: string
          title: Client Name
      type: object
      required:
      - status
      - client_name
      title: CliAuthApprovedOut
    CliAuthPollIn:
      properties:
        poll_secret:
          type: string
          title: Poll Secret
      type: object
      required:
      - poll_secret
      title: CliAuthPollIn
    CliAuthPollOut:
      properties:
        status:
          type: string
          enum:
          - pending
          - complete
          title: Status
        interval_seconds:
          type: integer
          title: Interval Seconds
        token:
          anyOf:
          - type: string
          - type: 'null'
          title: Token
        org_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Org Id
        org_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Org Name
      type: object
      required:
      - status
      - interval_seconds
      title: CliAuthPollOut
    CliAuthRequestOut:
      properties:
        client_name:
          type: string
          title: Client Name
        requester:
          type: string
          title: Requester
        expires_at:
          type: string
          format: date-time
          title: Expires At
      type: object
      required:
      - client_name
      - requester
      - expires_at
      title: CliAuthRequestOut
    CliAuthStartIn:
      properties:
        client_name:
          type: string
          maxLength: 80
          minLength: 1
          title: Client Name
          description: Where the CLI runs, e.g. the hostname; becomes the minted key's label
      type: object
      required:
      - client_name
      title: CliAuthStartIn
    CliAuthStartOut:
      properties:
        user_code:
          type: string
          title: User Code
        verification_url:
          type: string
          title: Verification Url
        poll_secret:
          type: string
          title: Poll Secret
        interval_seconds:
          type: integer
          title: Interval Seconds
        expires_in_seconds:
          type: integer
          title: Expires In Seconds
      type: object
      required:
      - user_code
      - verification_url
      - poll_secret
      - interval_seconds
      - expires_in_seconds
      title: CliAuthStartOut
    CredentialEntry:
      properties:
        ref:
          $ref: '#/components/schemas/SecretRef'
        priority:
          type: integer
          title: Priority
        version:
          type: integer
          title: Version
      type: object
      required:
      - ref
      - priority
      - version
      title: CredentialEntry
      description: 'One provider key the data plane may spend against, named but not carried.


        The ref says which secret; the data plane fetches the value from the store it is configured

        with. Nothing here is a secret and nothing here is a location, so a bundle at rest and a bundle

        on the wire are both safe to read.


        version is the cache key: a rotation keeps the ref and bumps this, so a data plane refetches

        within one poll rather than waiting out a TTL.'
    DataPlaneInstanceOut:
      properties:
        instance_id:
          type: string
          format: uuid
          title: Instance Id
        version:
          type: string
          title: Version
        bundle_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Bundle Id
        address:
          anyOf:
          - type: string
          - type: 'null'
          title: Address
        status:
          type: string
          enum:
          - online
          - offline
          title: Status
        first_seen:
          type: string
          format: date-time
          title: First Seen
        last_seen:
          type: string
          format: date-time
          title: Last Seen
      type: object
      required:
      - instance_id
      - version
      - bundle_id
      - address
      - status
      - first_seen
      - last_seen
      title: DataPlaneInstanceOut
    DeletedOut_UUID_:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        deleted_at:
          type: string
          format: date-time
          title: Deleted At
      type: object
      required:
      - id
      - deleted_at
      title: DeletedOut[UUID]
    DeletedOut_str_:
      properties:
        id:
          type: string
          title: Id
        deleted_at:
          type: string
          format: date-time
          title: Deleted At
      type: object
      required:
      - id
      - deleted_at
      title: DeletedOut[str]
    EnrollOut:
      properties:
        orgs:
          items:
            $ref: '#/components/schemas/OrgOut'
          type: array
          title: Orgs
        personal_org_id:
          anyOf:
