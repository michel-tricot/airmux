  /v1/events:
    post:
      tags:
      - Data Plane
      summary: Ingest Events
      description: 'Idempotent on event_id: at-least-once delivery lands exactly once, and a failed batch lands nothing.


        One atomic upsert rather than a read per event. Reading first would also be racy: two flushes

        carrying the same event_id would both see it missing and collide on the primary key, failing

        both batches, and at-least-once delivery makes that overlap ordinary rather than exotic. The

        outbox drains up to a thousand events at a time, so the per-event round trip cost was real too.

        ingested counts what RETURNING hands back, which under DO NOTHING is exactly the rows written,

        so a replay reports zero.


        Requires the `sync` scope.'
      operationId: ingest_events
      security:
      - HTTPBearer:
        - sync
      parameters:
      - name: X-Org-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Org-Id
      - name: X-Requested-With
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Requested-With
      - name: Sec-Fetch-Site
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sec-Fetch-Site
      - name: airllm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Airllm Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UsageEventV1'
              title: Events
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_EventsIngestedOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/heartbeat:
    post:
      tags:
      - Data Plane
      summary: Heartbeat
      description: 'Upsert the instance record; the row persists as history, last_seen drives liveness.


        Every worker of a multi-worker data plane heartbeats with the same instance_id, so the first

        insert can race; do it as one atomic upsert instead of read-then-write.


        Requires the `sync` scope.'
      operationId: heartbeat
      security:
      - HTTPBearer:
        - sync
      parameters:
      - name: X-Org-Id
