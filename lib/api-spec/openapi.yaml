    ProviderCredentialIn:
      properties:
        provider:
          type: string
          title: Provider
          description: Provider name from the catalog, e.g. openai
        name:
          type: string
          maxLength: 80
          minLength: 1
          title: Name
          description: Handle for this key within the provider and scope, e.g. prod or backup
          default: default
        value:
          type: string
          format: password
          title: Value
          description: The provider API key. Written to the secret store and never persisted anywhere else
          writeOnly: true
        priority:
          type: integer
          title: Priority
          description: Lower is tried first; ties break by name
          default: 100
        workspace:
          anyOf:
          - type: string
          - type: 'null'
          title: Workspace
          description: Workspace id or slug for a workspace-scoped key; omitted makes it org-scoped
      type: object
      required:
      - provider
      - value
      title: ProviderCredentialIn
      description: 'Creating a credential is an action, not a plain row insert: the value crosses the wire once

        and is never a column, so this is not a RecordCreate and is exempt from parity by that choice.


        The value is a SecretStr so nothing that renders this model can print it. That is not enough on

        its own: the validation error handler in app.py drops the offending input, or a body that fails

        validation for some other reason comes back to the caller with the key still in it.'
    ProviderCredentialOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        org_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Org Id
        workspace_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Workspace Id
        provider_id:
          type: string
          format: uuid
          title: Provider Id
        name:
          type: string
          title: Name
        priority:
          type: integer
          title: Priority
        enabled:
          type: boolean
          title: Enabled
        version:
          type: integer
          title: Version
        status:
