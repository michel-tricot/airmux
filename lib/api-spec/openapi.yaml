openapi: 3.1.0
info:
  title: airllm control plane
  version: 0.1.0
paths:
  /v1/auth/login:
    post:
      tags:
      - Auth
      summary: Login
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_MeOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
      description: No authentication required.
  /v1/auth/signup:
    post:
      tags:
      - Auth
      summary: Signup
      description: 'Open self-signup: an account holds no memberships, so it can see nothing until granted or until it founds
        an org.


        The exception is the first human on a deployment, who claims it and becomes its instance admin: a

        fresh install has no other way to reach the instance endpoints, and /instance/oss/claim exists to

        route that first visitor here. Every signup after the claim is an ordinary account. Anyone who can

        reach an unclaimed deployment can therefore take it, which is the same trapdoor the quickstart

        endpoint opens; claim the deployment before exposing it, or provision the admin with airllmcp admin.


        No authentication required.'
      operationId: signup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_MeOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Logout
      operationId: logout
      parameters:
      - name: X-Requested-With
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Requested-With
      - name: Sec-Fetch-Site
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sec-Fetch-Site
      - name: airllm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Airllm Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_DeletedOut_UUID__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: Requires an authenticated user; not org-scoped.
  /v1/auth/me:
    get:
      tags:
      - Auth
      summary: Me
      operationId: me
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Requested-With
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Requested-With
      - name: Sec-Fetch-Site
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sec-Fetch-Site
      - name: airllm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Airllm Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_MeOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: Requires an authenticated user; not org-scoped.
  /v1/auth/password:
    post:
      tags:
      - Auth
      summary: Change Password
      operationId: change_password
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Requested-With
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Requested-With
      - name: Sec-Fetch-Site
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sec-Fetch-Site
      - name: airllm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Airllm Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_PasswordChangedOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: Requires an authenticated user; not org-scoped.
  /v1/auth/cli/start:
    post:
      tags:
      - Auth
      summary: Cli Auth Start
      description: 'Open a device authorization: unauthenticated like signup, it grants nothing by itself.


        No authentication required.'
      operationId: cli_auth_start
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CliAuthStartIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_CliAuthStartOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /v1/auth/cli/request:
    get:
      tags:
      - Auth
      summary: Cli Auth Request Details
      description: 'Context for the approve page: who is asking, from where, until when.


        Requires an authenticated user; not org-scoped.'
      operationId: cli_auth_request_details
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
          title: Code
      - name: X-Requested-With
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Requested-With
      - name: Sec-Fetch-Site
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sec-Fetch-Site
      - name: airllm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Airllm Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_CliAuthRequestOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/cli/approve:
    post:
      tags:
      - Auth
      summary: Cli Auth Approve
      description: 'The human confirms the code and picks the org; membership backs the pick like key minting.


        Requires an authenticated user; not org-scoped.'
      operationId: cli_auth_approve
      parameters:
      - name: X-Requested-With
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Requested-With
      - name: Sec-Fetch-Site
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sec-Fetch-Site
      - name: airllm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Airllm Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CliAuthApproveIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_CliAuthApprovedOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/cli/poll:
    post:
      tags:
      - Auth
      summary: Cli Auth Poll
      description: 'The CLI''s side of the flow: pending until approved, then the key exactly once.


        The key is minted here, not at approve, so its plaintext never rests in the pending request;

        deleting the request in the same transaction makes delivery one-time. Route-level actor stamp

        like signup: the poller is anonymous, the audited key write is attributed to the human who

        approved. Re-approving from the same client replaces that client''s previous key for the org

        instead of accumulating.


        No authentication required.'
      operationId: cli_auth_poll
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CliAuthPollIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_CliAuthPollOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /v1/enroll:
    get:
      tags:
      - Enrollment
      summary: Enrollment
      description: 'The acting user''s standing: their orgs by name, and whether their one personal org exists.


        Requires an authenticated user; not org-scoped.'
      operationId: enrollment
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Requested-With
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Requested-With
      - name: Sec-Fetch-Site
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sec-Fetch-Site
      - name: airllm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Airllm Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_EnrollOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/enroll/org:
    post:
      tags:
      - Enrollment
      summary: Create Personal Org
      description: 'Found the acting user''s one personal org, with the creator as its first member.


        The unique personal_for column is the cap: the database refuses a second personal org

        however hard a credential races, so no scope or guard code is involved. Further orgs

        are admin-provisioned. The slot survives losing the membership; only deleting the

        personal org frees it.


        Requires an authenticated user; not org-scoped.'
      operationId: create_personal_org
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Requested-With
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Requested-With
      - name: Sec-Fetch-Site
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sec-Fetch-Site
      - name: airllm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Airllm Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_OrgOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/instance/oss/claim:
    get:
      tags:
      - OSS
      summary: Claim
      description: 'Whether any human holds an account yet: public so a fresh deployment can route its first visitor to signup.


        Service accounts do not claim an instance; it leaks nothing beyond set-up-or-not, like healthz.


        No authentication required.'
      operationId: claim
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_ClaimOut_'
      security: []
  /v1/instance/oss/quickstart:
    post:
      tags:
      - OSS
      summary: Quickstart
      description: 'Drop the data plane''s sync credential onto the shared volume so the first data plane can boot.


        A single-use bootstrap trapdoor: public, but it only fires while no data plane has ever

        registered, and it closes the moment one heartbeats. The caller already holds the token it

        writes, so nothing is minted or leaked here; the endpoint only bridges a token the operator

        has into the file the co-mounted data plane container waits for.


        Either control-plane key type can drive a data plane: a management key pins it to one org''s

        bundles, an instance key leaves the org to its config. The prefix check only catches a token

        that could never work at all, an inference key or a paste accident.


        No authentication required.'
      operationId: quickstart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuickstartIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_QuickstartOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /v1/instance/data-planes:
    get:
      tags:
      - Data Plane
      summary: List Data Planes
      description: 'Every data plane known to the instance; offline ones are kept as history and shown only with include_offline.


        Requires the `data-planes:read` scope.'
      operationId: list_data_planes
      security:
      - HTTPBearer:
        - data-planes:read
      parameters:
      - name: include_offline
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Offline
      - name: X-Org-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Org-Id
      - name: X-Requested-With
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Requested-With
      - name: Sec-Fetch-Site
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sec-Fetch-Site
      - name: airllm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Airllm Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_list_DataPlaneInstanceOut__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/instance/instance-keys:
    get:
      tags:
      - Instance Keys
      summary: List Instance Keys
      description: 'Every instance key on the deployment; there is no org axis to filter on.


        Requires the `instance-keys:read` scope.'
      operationId: list_instance_keys
      security:
      - HTTPBearer:
        - instance-keys:read
      parameters:
      - name: X-Org-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Org-Id
      - name: X-Requested-With
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Requested-With
      - name: Sec-Fetch-Site
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sec-Fetch-Site
      - name: airllm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Airllm Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_list_InstanceKeyOut__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Instance Keys
      summary: Create Instance Key
      description: 'Mint an instance key for the acting admin, or for another instance admin when user_id names one.


        Requires the `instance-keys:write` scope.'
      operationId: create_instance_key
      security:
      - HTTPBearer:
        - instance-keys:write
      parameters:
      - name: X-Org-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Org-Id
      - name: X-Requested-With
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Requested-With
      - name: Sec-Fetch-Site
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sec-Fetch-Site
      - name: airllm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Airllm Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceKeyIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_InstanceKeyMintedOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/instance/instance-keys/{key_id}:
    delete:
      tags:
      - Instance Keys
      summary: Revoke Instance Key
      operationId: revoke_instance_key
      security:
      - HTTPBearer:
        - instance-keys:write
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Key Id
      - name: X-Org-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Org-Id
      - name: X-Requested-With
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Requested-With
      - name: Sec-Fetch-Site
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sec-Fetch-Site
      - name: airllm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Airllm Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_InstanceKeyRevokedOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: Requires the `instance-keys:write` scope.
  /v1/instance/management-keys:
    get:
      tags:
      - Instance Management Keys
      summary: List All Management Keys
      description: 'Instance-wide oversight: every org''s management keys, optionally filtered to one org.


        Requires the `management-keys:read` scope.'
      operationId: list_all_management_keys
      security:
      - HTTPBearer:
        - management-keys:read
      parameters:
      - name: org_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Org Id
      - name: X-Org-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Org-Id
      - name: X-Requested-With
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Requested-With
      - name: Sec-Fetch-Site
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sec-Fetch-Site
      - name: airllm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Airllm Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_list_ManagementKeyOut__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/instance/management-keys/{key_id}:
    delete:
      tags:
      - Instance Management Keys
      summary: Revoke Any Management Key
      description: 'Revoke any org''s management key; the org-scoped route reaches only its own.


        Requires the `management-keys:write` scope.'
      operationId: revoke_any_management_key
      security:
      - HTTPBearer:
        - management-keys:write
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Key Id
      - name: X-Org-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Org-Id
      - name: X-Requested-With
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Requested-With
      - name: Sec-Fetch-Site
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sec-Fetch-Site
      - name: airllm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Airllm Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_ManagementKeyRevokedOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/instance/activity:
    get:
      tags:
      - Activity
      summary: List Instance Activity
      description: 'What changed anywhere on the instance, newest first; the org-scoped view of the same trail is /org/activity.


        Requires the `activity:read` scope.'
      operationId: list_instance_activity
      security:
      - HTTPBearer:
        - activity:read
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      - name: X-Org-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Org-Id
      - name: X-Requested-With
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Requested-With
      - name: Sec-Fetch-Site
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sec-Fetch-Site
      - name: airllm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Airllm Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_list_ActivityOut__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/users:
    post:
      tags:
      - Users
      summary: Create User
      operationId: create_user
      security:
      - HTTPBearer:
        - users:write
      parameters:
      - name: X-Org-Id
        in: header
