openapi: 3.1.0
info:
  title: AirLLM Control Plane API
  description: 'Manage AirLLM organizations, workspaces, access keys, provider credentials, and data-plane synchronization.


    Organization and workspace targets are part of each URL. Successful responses wrap their result in

    `{"data": ...}`. Authenticate with a control-plane access key or a browser session as documented by

    each operation. Inference keys authenticate model requests at the data plane and are not accepted here.

    '
  version: 0.1.0
paths:
  /api/v1/instance/access-keys:
    get:
      tags:
      - Instance Access Keys
      summary: List Instance Access Keys
      description: 'List access keys across all scopes, optionally filtered by principal.


        Required permission: `access-keys.read`.'
      operationId: list_instance_access_keys
      security:
      - AccessKey: []
      - SessionCookie: []
      parameters:
      - name: user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: User Id
        description: Return only access keys issued to this principal
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_list_AccessKeyOut__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Authentication failed
        '403':
          description: The credential does not have the required permission
    post:
      tags:
      - Instance Access Keys
      summary: Create Instance Access Key
      description: 'Issue an instance-scoped access key and return its token once.


        Required permission: `access-keys.issue`.'
      operationId: create_instance_access_key
      security:
      - AccessKey: []
      - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessKeyIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AccessKeyMintedOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Authentication failed
        '403':
          description: The credential does not have the required permission
  /api/v1/orgs/{org_id}/access-keys:
    get:
      tags:
      - Organization Access Keys
      summary: List Org Access Keys
      description: 'List organization- and workspace-scoped access keys within an organization.


        Required permission: `access-keys.read`.'
      operationId: list_org_access_keys
      security:
      - AccessKey: []
      - SessionCookie: []
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Org Id
        description: Organization ID
      - name: user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: User Id
        description: Return only access keys issued to this principal
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_list_AccessKeyOut__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Authentication failed
        '403':
          description: The credential does not have the required permission
    post:
      tags:
      - Organization Access Keys
      summary: Create Org Access Key
      description: 'Issue an organization-scoped access key and return its token once.


        Required permission: `access-keys.issue`.'
      operationId: create_org_access_key
      security:
      - AccessKey: []
      - SessionCookie: []
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Org Id
        description: Organization ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessKeyIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AccessKeyMintedOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Authentication failed
        '403':
          description: The credential does not have the required permission
  /api/v1/orgs/{org_id}/workspaces/{workspace_ref}/access-keys:
    get:
      tags:
      - Workspace Access Keys
      summary: List Workspace Access Keys
      description: 'List access keys scoped to one workspace.


        Required permission: `access-keys.read`.'
      operationId: list_workspace_access_keys
      security:
      - AccessKey: []
      - SessionCookie: []
      parameters:
      - name: workspace_ref
        in: path
        required: true
        schema:
          type: string
          title: Workspace Ref
        description: Workspace ID or slug
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Org Id
        description: Organization ID
      - name: user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: User Id
        description: Return only access keys issued to this principal
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_list_AccessKeyOut__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Authentication failed
        '403':
          description: The credential does not have the required permission
    post:
      tags:
      - Workspace Access Keys
      summary: Create Workspace Access Key
      description: 'Issue a workspace-scoped access key and return its token once.


        Required permission: `access-keys.issue`.'
      operationId: create_workspace_access_key
      security:
      - AccessKey: []
      - SessionCookie: []
      parameters:
      - name: workspace_ref
        in: path
        required: true
        schema:
          type: string
          title: Workspace Ref
        description: Workspace ID or slug
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Org Id
        description: Organization ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessKeyIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AccessKeyMintedOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Authentication failed
        '403':
          description: The credential does not have the required permission
  /api/v1/access-keys/{key_id}:
    delete:
      tags:
      - Instance Access Keys
      - Organization Access Keys
      - Workspace Access Keys
      summary: Revoke Access Key
      description: 'Revoke an access key and every key delegated from it.


        Required permission: `access-keys.revoke`.'
      operationId: revoke_access_key
      security:
      - AccessKey: []
      - SessionCookie: []
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Key Id
        description: Access key ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AccessKeyRevokedOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Authentication failed
        '403':
          description: The credential does not have the required permission
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Login
      description: 'Authenticate a human user and start a browser session.


        Authentication: none.'
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_MeOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/auth/signup:
    post:
      tags:
      - Auth
      summary: Sign Up
      description: 'Create a human account and start a browser session.


        The first human account on a new deployment becomes the instance owner. Later accounts require

        an organization membership or instance role before they can access managed resources.


        Authentication: none.'
      operationId: signup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_MeOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Logout
      description: 'End the current browser session and clear its cookie.


        Authentication: browser session.'
      operationId: logout
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_DeletedOut_UUID__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: A valid browser session is required
        '403':
          description: The request failed browser security checks
      security:
      - SessionCookie: []
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: Get Current User
      description: 'Return the authenticated human user and the organizations visible to this credential.


        Authentication: human account using a browser session or control-plane access key.'
      operationId: me
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_MeOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: An authenticated human account is required
      security:
      - AccessKey: []
      - SessionCookie: []
  /api/v1/auth/permissions:
    get:
      tags:
      - Auth
      summary: Get Effective Permissions
      description: 'Return the effective permissions this credential can exercise at the requested scope.


        Authentication: browser session or control-plane access key.'
      operationId: my_permissions
      security:
      - AccessKey: []
      - SessionCookie: []
      parameters:
      - name: org_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Org Id
        description: Organization scope to evaluate; omit for instance scope
      - name: workspace_ref
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Workspace Ref
        description: Workspace ID or slug to evaluate within org_id; omit for organization scope
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_MyPermissionsOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Authentication failed
  /api/v1/auth/password:
    post:
      tags:
      - Auth
      summary: Change Password
      description: 'Replace the authenticated user''s password after verifying the current password.


        Authentication: human account using a browser session or control-plane access key.'
      operationId: change_password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_PasswordChangedOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: An authenticated human account is required
      security:
      - AccessKey: []
      - SessionCookie: []
  /api/v1/auth/cli/start:
    post:
      tags:
      - Auth
      summary: Start CLI Authorization
      description: 'Create a short-lived device authorization for a CLI sign-in.


        Authentication: none.'
      operationId: cli_auth_start
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CliAuthStartIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_CliAuthStartOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/auth/cli/request:
    get:
      tags:
      - Auth
      summary: Get CLI Authorization Request
      description: 'Return the client and expiry details for a device authorization code.


        Authentication: browser session.'
      operationId: cli_auth_request_details
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
          title: Code
        description: Device authorization code shown by the CLI
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_CliAuthRequestOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: A valid browser session is required
        '403':
          description: The request failed browser security checks
      security:
      - SessionCookie: []
  /api/v1/auth/cli/approve:
    post:
      tags:
      - Auth
      summary: Approve CLI Authorization
      description: 'Approve a device authorization for one organization visible to the current user.


        Authentication: browser session.'
      operationId: cli_auth_approve
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CliAuthApproveIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_CliAuthApprovedOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: A valid browser session is required
        '403':
          description: The request failed browser security checks
      security:
      - SessionCookie: []
  /api/v1/auth/cli/poll:
    post:
      tags:
      - Auth
      summary: Poll CLI Authorization
      description: 'Return pending status or deliver the approved organization-scoped access key once.


        When the request includes the CLI''s current access key for the same user and organization, that

        key is revoked as part of replacement. Labels do not participate in matching.


        Authentication: none.'
      operationId: cli_auth_poll
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CliAuthPollIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_CliAuthPollOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/enroll:
    get:
      tags:
      - Enrollment
      summary: Get Current Enrollment
      description: 'List the organizations visible to the current user and identify their personal organization.


        Authentication: human account using a browser session or control-plane access key.'
      operationId: enrollment
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_EnrollOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: An authenticated human account is required
      security:
      - AccessKey: []
      - SessionCookie: []
  /api/v1/enroll/org:
    post:
      tags:
      - Enrollment
      summary: Create Personal Organization
      description: 'Create the current user''s personal organization and make them its owner.


        A user can own one personal organization at a time. Deleting it allows another to be created.


        Authentication: browser session.'
      operationId: create_personal_org
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_OrgOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: A valid browser session is required
        '403':
          description: The request failed browser security checks
      security:
      - SessionCookie: []
  /api/v1/enroll/invitations/preview:
    post:
      tags:
      - Enrollment
      summary: Preview Invitation
      description: 'Preview the organization and optional workspace named by a shared invitation secret.


        Authentication: none.'
      operationId: preview_invitation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationTokenIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_InvitationPreviewOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/enroll/invitations/accept:
    post:
      tags:
      - Enrollment
      summary: Accept Invitation
      description: 'Accept an invitation whose email matches the signed-in human account.


        Authentication: browser session.'
      operationId: accept_invitation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationTokenIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_InvitationAcceptedOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: A valid browser session is required
        '403':
          description: The request failed browser security checks
      security:
      - SessionCookie: []
  /api/v1/instance/oss/claim:
    get:
      tags:
      - OSS
      summary: Get Instance Claim Status
      description: 'Return whether a human account has claimed this deployment.


        Authentication: none.'
      operationId: claim
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_ClaimOut_'
      security: []
  /api/v1/instance/oss/quickstart:
    post:
      tags:
      - OSS
      summary: Install First Data Plane Credential
      description: 'Install an existing access key where the first co-located data plane can read it.


        This endpoint is available only until a data plane first registers. The key must authenticate a

        service account and carry exactly the bundle, event-ingestion, and heartbeat permissions.


        Authentication: none.'
      operationId: quickstart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuickstartIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_QuickstartOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/instance/data-planes:
    get:
      tags:
      - Data Plane Instances
      summary: List Data Planes
      description: 'List data-plane instances by most recent heartbeat.


        Required permission: `data-planes.read`.'
      operationId: list_data_planes
      security:
      - AccessKey: []
      - SessionCookie: []
      parameters:
      - name: include_offline
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Offline
        description: Include data planes whose most recent heartbeat is outside the online window
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_list_DataPlaneInstanceOut__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Authentication failed
        '403':
          description: The credential does not have the required permission
  /api/v1/instance/activity:
    get:
      tags:
      - Instance Activity
      summary: List Instance Activity
      description: 'List the most recent audited changes across the instance.


        Required permission: `audit.read`.'
      operationId: list_instance_activity
      security:
      - AccessKey: []
      - SessionCookie: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
        description: Maximum number of results to return
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_list_ActivityOut__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Authentication failed
        '403':
          description: The credential does not have the required permission
  /api/v1/service-accounts:
    post:
      tags:
      - Instance Users
      summary: Create Service Account
      description: 'Create a machine principal with an optional instance role.


        Required permission: `principals.manage`.'
      operationId: create_service_account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAccountIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_UserOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Authentication failed
        '403':
          description: The credential does not have the required permission
      security:
      - AccessKey: []
      - SessionCookie: []
  /api/v1/users/{user_id}:
    get:
      tags:
      - Instance Users
      summary: Get User
      description: 'Return one human user or service account and its organization memberships.


        Required permission: `principals.read`.'
      operationId: get_user
      security:
      - AccessKey: []
      - SessionCookie: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
        description: User or service-account ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_UserOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Authentication failed
        '403':
          description: The credential does not have the required permission
    delete:
      tags:
      - Instance Users
      summary: Delete User
      description: 'Delete a principal and its login identities, sessions, and control-plane access keys.


        Remove organization memberships, personal organizations, and workspaces containing inference

        keys created by this principal before deleting it.


        Required permission: `principals.manage`.'
      operationId: delete_user
      security:
      - AccessKey: []
      - SessionCookie: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
        description: User or service-account ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_DeletedOut_UUID__'
        '422':
          description: Validation Error
          content:
