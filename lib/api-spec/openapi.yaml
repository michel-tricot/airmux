    DeniedUsageEventV1:
      properties:
        schema_version:
          type: integer
          const: 1
          title: Schema Version
          description: Usage event schema version
          default: 1
        event_id:
          type: string
          format: uuid
          title: Event Id
          description: Idempotency key for event ingestion
        request_id:
          type: string
          format: uuid
          title: Request Id
          description: Data-plane request ID
        occurred_at:
          type: string
          format: date-time
          title: Occurred At
          description: Timestamp when the request completed
        org_id:
          type: string
          format: uuid
          title: Org Id
          description: Organization that made the request
        workspace_id:
          type: string
          format: uuid
          title: Workspace Id
          description: Workspace that made the request
        key_id:
          type: string
          maxLength: 255
          minLength: 1
          title: Key Id
          description: Inference key ID used for the request
        model_id:
          type: string
          maxLength: 255
          minLength: 1
          title: Model Id
          description: Caller-facing model ID
        provider_id:
          type: string
          const: ''
          title: Provider Id
          description: No provider was selected before denial
          default: ''
        bundle_id:
          type: string
          format: uuid
          title: Bundle Id
          description: Policy bundle used for the request
        input_tokens:
          type: integer
          maximum: 2147483647.0
          minimum: 0.0
          title: Input Tokens
          description: Total input tokens
        output_tokens:
          type: integer
          maximum: 2147483647.0
          minimum: 0.0
          title: Output Tokens
          description: Total output tokens
        cost_usd:
          type: string
          pattern: ^\d+(?:\.\d+)?$
          title: Cost Usd
          description: Total estimated cost in USD
        cost_input_usd:
          type: string
          pattern: ^\d+(?:\.\d+)?$
          title: Cost Input Usd
          description: Estimated input cost in USD
          default: '0'
        cost_output_usd:
          type: string
          pattern: ^\d+(?:\.\d+)?$
          title: Cost Output Usd
          description: Estimated output cost in USD
          default: '0'
        max_output_tokens:
          anyOf:
          - type: integer
            maximum: 2147483647.0
            minimum: 1.0
          - type: 'null'
          title: Max Output Tokens
          description: Effective upstream output-token limit
        cache_read_tokens:
          type: integer
          maximum: 2147483647.0
          minimum: 0.0
          title: Cache Read Tokens
          description: Input tokens read from a provider cache
          default: 0
        cache_write_tokens:
          type: integer
          maximum: 2147483647.0
          minimum: 0.0
          title: Cache Write Tokens
          description: Input tokens written to a provider cache
          default: 0
        latency_ms:
          type: integer
          maximum: 2147483647.0
          minimum: 0.0
          title: Latency Ms
          description: End-to-end request latency in milliseconds
        status:
          type: string
          const: denied
          title: Status
          description: The request was denied before routing
          default: denied
        stream:
          type: boolean
          title: Stream
          description: Whether the response was streamed
        credential_id:
          type: 'null'
          title: Credential Id
          description: No provider credential was selected before denial
        credential_scope:
          type: 'null'
          title: Credential Scope
          description: No provider credential scope was selected before denial
      additionalProperties: false
      type: object
      required:
      - event_id
      - request_id
      - occurred_at
      - org_id
      - workspace_id
      - key_id
      - model_id
      - bundle_id
      - input_tokens
      - output_tokens
      - cost_usd
      - max_output_tokens
      - latency_ms
      - stream
      title: DeniedUsageEventV1
