[project]
name = "contract"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "asyncpg",
  "pydantic>=2",
  "cryptography",
  "pyyaml",
  "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contract"]
