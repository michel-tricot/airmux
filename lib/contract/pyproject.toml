[project]
name = "contract"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "cel-expr-python==0.1.3",
  "asyncpg",
  "pydantic>=2",
  "pyyaml",
  "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contract"]
