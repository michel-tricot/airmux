[project]
name = "airmux-runtime"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
  "airmux-contract",
  "anyio",
  "opentelemetry-exporter-otlp-proto-http",
  "opentelemetry-exporter-prometheus",
  "opentelemetry-sdk",
  "pydantic>=2.13.5",
  "prometheus-client",
  "pyyaml",
]

[project.optional-dependencies]
insecure-database = ["asyncpg"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airmux_runtime"]
