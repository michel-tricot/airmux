services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airllm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airllm}
      POSTGRES_DB: airllm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "airllm"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  airllm:
    image: ${AIRLLM_IMAGE:-airllm:local}
    build:
      context: .
      target: all-in-one
    environment:
      DATABASE_URL: postgresql+asyncpg://airllm:${POSTGRES_PASSWORD:-airllm}@postgres:5432/airllm
      AIRLLM_CONSOLE_URL: ${AIRLLM_PUBLIC_URL:-http://localhost:8080}
      AIRLLM_PUBLIC_SIGNUP: ${AIRLLM_PUBLIC_SIGNUP:-false}
    ports:
      - "${AIRLLM_PORT:-8080}:8080"
    volumes:
      - state:/state
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 30
    stop_grace_period: 40s
    restart: unless-stopped

volumes:
  state:
  pgdata:
