services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: airllm
      POSTGRES_PASSWORD: airllm
      POSTGRES_DB: airllm
#    ports:
#      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airllm"]
      interval: 5s
      start_period: 10s

  control-plane:
    build: .
    # Generate a signing key into the shared volume on first boot if none was supplied, then reuse it.
    command: >
      sh -c '
        if [ -z "$$GW_BUNDLE_SIGNING_KEY" ]; then
          [ -f /state/signing.key ] || airllmcp keygen --out /state/signing.key;
          export GW_BUNDLE_SIGNING_KEY=$$(cat /state/signing.key); 
        fi;
      airllmcp migrate && airllmcp taxonomy && airllmcp serve --host 0.0.0.0 --port 8000'
    environment:
      GW_BUNDLE_SIGNING_KEY: ${GW_BUNDLE_SIGNING_KEY:-}
    volumes:
      - state:/state
      - ./docker/airllm.yml:/state/airllm.yml:ro
      - ./taxonomy.yml:/state/taxonomy.yml:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      start_period: 10s

  data-plane:
    build: .
    # Read the public key the control plane generated into the shared volume, and use GW_DATAPLANE_TOKEN
    # if set, else wait for the token oss-quickstart drops on the shared volume.
    command: >
      sh -c '
      if [ -z "$$GW_BUNDLE_PUBLIC_KEY" ] && [ -f /state/signing.pub ]; then 
        export GW_BUNDLE_PUBLIC_KEY=$$(cat /state/signing.pub); 
      fi;
      if [ -z "$$GW_DATAPLANE_TOKEN" ]; then
        until [ -f /state/dataplane.key ]; do echo "waiting for /state/dataplane.key (run oss-quickstart)"; sleep 2; done;
        export GW_DATAPLANE_TOKEN=$$(cat /state/dataplane.key); 
      fi;
      exec airllmdp --host 0.0.0.0 --port 8080'
    environment:
      GW_DATAPLANE_TOKEN: ${GW_DATAPLANE_TOKEN:-}
      GW_BUNDLE_PUBLIC_KEY: ${GW_BUNDLE_PUBLIC_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - state:/state
      - ./docker/airllm.yml:/state/airllm.yml:ro
    ports:
      - "8080:8080"
    depends_on:
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/readyz')"]
      interval: 5s
      start_period: 15s

  webapp:
    build: apps/webapp
    ports:
      - "3000:80"
    depends_on:
      control-plane:
        condition: service_healthy

volumes:
  state:
  pgdata:
