services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airmux
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airmux}
      POSTGRES_DB: airmux
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "airmux"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  airmux:
    image: ${AIRMUX_IMAGE:-airmux:local}
    command: airmux
    environment:
      DATABASE_URL: postgresql+asyncpg://airmux:${POSTGRES_PASSWORD:-airmux}@postgres:5432/airmux
      AIRMUX_CONSOLE_URL: ${AIRMUX_PUBLIC_URL:-http://localhost:8080}
      AIRMUX_PUBLIC_SIGNUP: ${AIRMUX_PUBLIC_SIGNUP:-false}
    ports:
      - "${AIRMUX_PORT:-8080}:8080"
    volumes:
      - state:/state
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 30
    stop_grace_period: 40s
    restart: unless-stopped

volumes:
  state:
  pgdata:
