# The provider keys both planes resolve credentials from, named once so they cannot drift apart:
# the control plane accepts a credential only for a key it can already see, and the data plane
# spends it. One entry per provider in taxonomy.yml; unset ones simply have no credential.
x-provider-keys: &provider-keys
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  XAI_API_KEY: ${XAI_API_KEY:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airllm
      POSTGRES_PASSWORD: airllm
      POSTGRES_DB: airllm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airllm"]
      interval: 5s
      start_period: 10s

  control-plane:
    build: .
    # The one checked-in airllm.yml serves the checkout and this stack: the working directory is the shared
    # /state volume, so its relative refs land here, and the values that differ come in as variables below.
    # Bring your own GW_BUNDLE_SIGNING_KEY (then also pass the matching GW_BUNDLE_PUBLIC_KEY to the data
    # plane), or leave it unset and keygen writes signing.key and its matching signing.pub together.
    command: >
      sh -c '
        umask 077;
        mkdir -p /state/.airllm;
        if [ -n "$$GW_BUNDLE_SIGNING_KEY" ]; then
          printf %s "$$GW_BUNDLE_SIGNING_KEY" > /state/.airllm/signing.key;
        else
          [ -f /state/.airllm/signing.key ] || airllmcp keygen;
        fi;
        airllmcp migrate && airllmcp taxonomy && airllmcp serve --host 0.0.0.0 --port 8000'
    environment:
      <<: *provider-keys
      DATABASE_URL: postgresql+asyncpg://airllm:airllm@postgres:5432/airllm
      GW_CONSOLE_URL: http://localhost:5000
      GW_BUNDLE_SIGNING_KEY: ${GW_BUNDLE_SIGNING_KEY:-}
    volumes:
      - state:/state
      - ./airllm.yml:/state/airllm.yml:ro
      - ./taxonomy/taxonomy.yml:/state/taxonomy.yml:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      start_period: 10s

  data-plane:
    build: .
    # Bring your own GW_BUNDLE_PUBLIC_KEY (must match the control plane's signing key), or leave it unset
    # and wait for the key keygen wrote to the shared volume. Then wait for the token airllm quickstart drops.
    command: >
      sh -c '
      umask 077;
      mkdir -p /state/.airllm;
      if [ -n "$$GW_BUNDLE_PUBLIC_KEY" ]; then
        printf %s "$$GW_BUNDLE_PUBLIC_KEY" > /state/.airllm/signing.pub;
      else
        until [ -f /state/.airllm/signing.pub ]; do echo "waiting for /state/.airllm/signing.pub (control plane starting)"; sleep 2; done;
      fi;
      if [ -n "$$GW_DATAPLANE_TOKEN" ]; then
        printf %s "$$GW_DATAPLANE_TOKEN" > /state/.airllm/dataplane.key;
      else
        until [ -f /state/.airllm/dataplane.key ]; do echo "waiting for /state/.airllm/dataplane.key (run airllm quickstart)"; sleep 2; done;
      fi;
      exec airllmdp serve --host 0.0.0.0 --port 8080'
    environment:
      <<: *provider-keys
      GW_DATAPLANE_CONTROL_PLANE_URL: http://control-plane:8000
      GW_DATAPLANE_TOKEN: ${GW_DATAPLANE_TOKEN:-}
      GW_BUNDLE_PUBLIC_KEY: ${GW_BUNDLE_PUBLIC_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - state:/state
      - ./airllm.yml:/state/airllm.yml:ro
    ports:
      - "8080:8080"
    depends_on:
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/readyz')"]
      interval: 5s
      start_period: 15s

  console:
    build:
      context: .
      dockerfile: apps/console/Dockerfile
    ports:
      - "5000:80"
    depends_on:
      control-plane:
        condition: service_healthy

volumes:
  state:
  pgdata:
