services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tokkeeper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tokkeeper}
      POSTGRES_DB: tokkeeper
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "tokkeeper"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  tokkeeper:
    image: ${TOKKEEPER_IMAGE:-tokkeeper:local}
    build:
      context: .
      target: all-in-one
    environment:
      DATABASE_URL: postgresql+asyncpg://tokkeeper:${POSTGRES_PASSWORD:-tokkeeper}@postgres:5432/tokkeeper
      TOKKEEPER_CONSOLE_URL: ${TOKKEEPER_PUBLIC_URL:-http://localhost:8080}
      TOKKEEPER_PUBLIC_SIGNUP: ${TOKKEEPER_PUBLIC_SIGNUP:-false}
    ports:
      - "${TOKKEEPER_PORT:-8080}:8080"
    volumes:
      - state:/state
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 30
    stop_grace_period: 40s
    restart: unless-stopped

volumes:
  state:
  pgdata:
