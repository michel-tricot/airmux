services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airmux
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airmux}
      POSTGRES_DB: airmux
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "airmux"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: ${AIRMUX_IMAGE:-ghcr.io/michel-tricot/airmux:latest}
    entrypoint: ["/usr/bin/tini", "--", "airmux"]
    command: ["control-plane", "migrate", "--config", "/app/deploy/docker/airmux.yml"]
    environment:
      DATABASE_URL: postgresql+asyncpg://airmux:${POSTGRES_PASSWORD:-airmux}@postgres:5432/airmux
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  taxonomy:
    image: ${AIRMUX_IMAGE:-ghcr.io/michel-tricot/airmux:latest}
    entrypoint: ["/usr/bin/tini", "--", "airmux"]
    command: ["control-plane", "taxonomy", "--config", "/app/deploy/docker/airmux.yml", "--file", "/app/taxonomy/taxonomy.yml"]
    environment:
      DATABASE_URL: postgresql+asyncpg://airmux:${POSTGRES_PASSWORD:-airmux}@postgres:5432/airmux
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  airmux:
    image: ${AIRMUX_IMAGE:-ghcr.io/michel-tricot/airmux:latest}
    command: airmux
    environment:
      DATABASE_URL: postgresql+asyncpg://airmux:${POSTGRES_PASSWORD:-airmux}@postgres:5432/airmux
      AIRMUX_CONSOLE_URL: ${AIRMUX_PUBLIC_URL:-http://localhost:8080}
      AIRMUX_PUBLIC_SIGNUP: ${AIRMUX_PUBLIC_SIGNUP:-false}
    ports:
      - "${AIRMUX_PORT:-8080}:8080"
    volumes:
      - state:/state
    depends_on:
      taxonomy:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 30
    stop_grace_period: 40s
    restart: unless-stopped

volumes:
  state:
  pgdata:
