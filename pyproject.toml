[project]
name = "airllm"
version = "0.1.0"
requires-python = ">=3.13"

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
gw-contract = { workspace = true }

[dependency-groups]
dev = [
  "ruff>=0.14",
  "ty>=0.0.50",
  "pytest", "pytest-asyncio", "respx", "anyio",
  "import-linter",
  "pre-commit",
]

[tool.pytest.ini_options]
testpaths = ["packages/contract/tests", "apps/control-plane/tests", "apps/data-plane/tests", "apps/cli/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 150
target-version = "py313"
src = ["packages/contract/src", "apps/control-plane/src", "apps/data-plane/src", "apps/cli/src"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "F", "E", "W",
  "I",
  "N",
  "UP",
  "ANN",
  "ASYNC",
  "S",
  "BLE",
  "B",
  "A",
  "C4",
  "DTZ",
  "T10",
  "EM",
  "FA",
  "ISC",
  "ICN",
  "LOG", "G",
  "INP",
  "PIE",
  "T20",
  "PYI",
  "PT",
  "Q",
  "RSE", "RET",
  "SLF",
  "SIM",
  "TID",
  "TC",
  "ARG",
  "PTH",
  "ERA",
  "PGH",
  "PL",
  "TRY",
  "FLY", "PERF", "FURB",
  "RUF",
]
ignore = [
  "COM812",
  "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**"                  = ["S101", "PLR2004", "ANN", "ARG", "SLF001", "INP001"]
"**/migrations/versions/*.py"  = ["ALL"]
"**/migrations/env.py"         = ["INP001"]
"apps/cli/**"                  = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["gw_contract", "control_plane", "data_plane"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "sqlmodel.SQLModel"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.terminal]
error-on-warning = true
