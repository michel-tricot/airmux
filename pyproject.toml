[project]
name = "airllm"
version = "0.1.0"
requires-python = ">=3.13"

[tool.uv.workspace]
members = ["lib/api-models", "lib/contract", "apps/*", "model-audit", "tests/*"]
exclude = ["apps/console"]

[tool.uv.sources]
api-models = { workspace = true }
contract = { workspace = true }

[dependency-groups]
dev = [
  "ruff>=0.14",
  "ty>=0.0.50",
  "pytest", "pytest-asyncio", "pytest-xdist", "respx", "anyio",
  "jsonschema",
  "openai",
  "anthropic",
  "testcontainers",
  "import-linter",
  "pre-commit",
  "datamodel-code-generator",
]

[tool.pytest.ini_options]
testpaths = ["lib/contract/tests", "apps/control-plane/tests", "apps/data-plane/tests", "apps/cli/tests", "model-audit/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 150
target-version = "py313"
extend-exclude = [".agents", ".claude", "model-audit/catalog/scripts"]
src = ["lib/api-models/src", "lib/contract/src", "apps/control-plane/src", "apps/data-plane/src", "apps/cli/src", "model-audit/src"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "F", "E", "W",
  "I",
  "N",
  "UP",
  "ANN",
  "ASYNC",
  "S",
  "BLE",
  "B",
  "A",
  "C4",
  "DTZ",
  "T10",
  "EM",
  "FA",
  "ISC",
  "ICN",
  "LOG", "G",
  "INP",
  "PIE",
  "T20",
  "PYI",
  "PT",
  "Q",
  "RSE", "RET",
  "SLF",
  "SIM",
  "TID",
  "TC",
  "ARG",
  "PTH",
  "ERA",
  "PGH",
  "PL",
  "TRY",
  "FLY", "PERF", "FURB",
  "RUF",
]
ignore = [
  "COM812",
  "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**"                  = ["S101", "S105", "S106", "PLR2004", "ANN", "ARG", "SLF001", "INP001"]
"**/migrations/versions/*.py"  = ["ALL"]
"**/migrations/env.py"         = ["INP001"]
"apps/cli/**"                  = ["T201"]
"examples/**"                  = ["T201", "INP001"]
"lib/api-models/src/api_models/__init__.py" = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["api_models", "contract", "control_plane", "data_plane", "model_audit"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod", "sqlalchemy.orm.declared_attr", "sqlalchemy.orm.declared_attr.directive"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
  "pydantic.BaseModel", "sqlmodel.SQLModel", "control_plane.models.common.base.Record",
  "control_plane.models.common.wire.RecordOut", "control_plane.models.common.wire.RecordCreate", "control_plane.models.common.wire.RecordUpdate",
]

[tool.ty.src]
exclude = [".agents", ".claude", "model-audit/catalog/scripts", "**/migrations/versions", "examples/anthropic_sdk.py"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.terminal]
error-on-warning = true
