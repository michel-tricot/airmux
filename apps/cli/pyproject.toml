[project]
name = "tokkeeper"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "tokkeeper-api-models==0.1.0",
  "tokkeeper-contract==0.1.0",
  "tokkeeper-data-plane==0.1.0",
  "tokkeeper-control-plane==0.1.0",
  "httpx",
  "typer",
  "python-dotenv",
  "pyyaml",
  "rich",
  "tomli-w>=1.2.0",
]

[project.scripts]
tokkeeper = "cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli"]
