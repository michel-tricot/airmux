[project]
name = "cli"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "api-models",
  "contract",
  "httpx",
  "typer",
  "python-dotenv",
  "pyyaml",
  "rich",
  "tomli-w>=1.2.0",
]

[project.scripts]
tokkeeper = "cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli"]
