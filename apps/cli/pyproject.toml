[project]
name = "airmux"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
  "airmux-api-models",
  "airmux-contract",
  "airmux-runtime",
  "airmux-data-plane",
  "airmux-control-plane",
  "httpx",
  "typer",
  "python-dotenv",
  "pyyaml",
  "rich",
  "tomli-w>=1.2.0",
]

[project.scripts]
airmux = "cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli"]
