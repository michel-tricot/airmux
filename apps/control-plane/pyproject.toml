[project]
name = "control-plane"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "contract",
  "fastapi",
  "sqlmodel",
  "sqlalchemy[asyncio]>=2",
  "aiosqlite",
  "alembic",
  "uvicorn[standard]",
  "typer",
  "python-dotenv",
  "pyyaml",
]

[project.scripts]
control-plane = "control_plane.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_plane"]
