[project]
name = "tokkeeper-control-plane"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "tokkeeper-contract==0.1.0",
  "fastapi",
  "sqlmodel",
  "sqlalchemy[asyncio]>=2",
  "asyncpg",
  "alembic",
  "uvicorn[standard]",
  "pyyaml",
  "argon2-cffi>=23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_plane"]
