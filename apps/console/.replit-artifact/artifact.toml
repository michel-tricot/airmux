kind = "web"
previewPath = "/"
title = "LLM Gateway Console"
description = "An admin web console for an LLM gateway. Manages principals, roles, tenant-bound access keys, organizations, workspaces, and inference keys through the generated control-plane client."
version = "1.0.0"
id = "artifacts/gateway-console"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20383

[services.development]
run = "bun run --filter @workspace/gateway-console dev"

[services.production]
build = [ "bun", "run", "--filter", "@workspace/gateway-console", "build" ]
serve = "static"
publicDir = "apps/console/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20383"
BASE_PATH = "/"
