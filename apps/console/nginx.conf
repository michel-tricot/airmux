server {
  listen 80;
  root /usr/share/nginx/html;

  # The session cookie is same-site, so the API has to answer on this origin; vite's dev server
  # proxies the same path to the same place.
  location /v1/ {
    proxy_pass http://control-plane:8000;
  }

  location / {
    try_files $uri /index.html;
  }
}
