vars:
  cache_dir: .tokkeeper

control_plane:
  database:
    # DATABASE_URL when the host sets one, as Replit's managed PostgreSQL and docker-compose.yml do;
    # otherwise the docker-compose.dev.yml database named after :-. A managed postgresql:// url gains
    # the asyncpg driver on load and can be used as handed over.
    url: ${env:DATABASE_URL:-postgresql+asyncpg://tokkeeper:tokkeeper@127.0.0.1:5432/tokkeeper}
  bootstrap:
    # Generate once with: uv run tokkeepercp bootstrap-keygen
    token: ${file:${var:cache_dir}/dataplane.key}
  console_url: ${env:TOKKEEPER_CONSOLE_URL:-http://127.0.0.1:5000}
  public_signup: ${env:TOKKEEPER_PUBLIC_SIGNUP:-false}
  secrets:
    # One file per credential under root, owner-readable only. Both planes must name the same
    # store, because the control plane writes what the data plane reads, so root has to be a
    # path both processes can reach. Under docker-compose that is the shared `state` volume,
    # which is why it sits beside the rest of the cache_dir state.
    kind: file
    root: ${var:cache_dir}/secrets

data_plane:
  bundle:
    kind: remote # or local, with path pointing at a hand-written bundle file
    control_plane: &control_plane
      url: ${env:TOKKEEPER_DATAPLANE_CONTROL_PLANE_URL:-http://127.0.0.1:8000}
      # Authorized by the control plane before it reports healthy
      token: ${file:${var:cache_dir}/dataplane.key}
    cache_dir: ${var:cache_dir}
    poll_interval_s: 5
  events:
    kind: sqlite
    control_plane: *control_plane
    cache_dir: ${var:cache_dir}
    flush_interval_s: 5
  secrets:
    # Must match the control plane's store above, root included
    kind: file
    root: ${var:cache_dir}/secrets
