# Bootstrap seed for the provider catalog. Generated by airmux-audit; do not hand-edit.
#
# This is the half of taxonomy/ that cannot be regenerated: the list of providers and the
# addresses of their facts. Schemas, model lists, icons and reports are all derived from
# these fields, so taxonomy/ can be deleted and rebuilt from this file alone.
#
# Every field means what it means in providers.yml. schema is deliberately absent, since
# it is produced from openapi.
providers:
- id: openai
  name: OpenAI
  icon_mono: openai
  icon_color: openai
  homepage: https://openai.com
  docs: https://platform.openai.com/docs
  base_url: https://api.openai.com/v1
  openapi: https://raw.githubusercontent.com/openai/openai-openapi/master/openapi.yaml
  models_url: https://api.openai.com/v1/models
  ingress:
  - oai
  - oai_responses
  primary_surface: oai
  auth:
  - bearer
  env_var: OPENAI_API_KEY
- id: anthropic
  name: Anthropic
  icon_mono: anthropic
  icon_color: anthropic
  homepage: https://www.anthropic.com
  docs: https://platform.claude.com/docs
