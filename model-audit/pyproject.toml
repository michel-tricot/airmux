[project]
name = "model-audit"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "anthropic",
  "tokkeeper-contract",
  "httpx",
  "openai",
  "pydantic>=2",
  "python-dotenv",
  "pyyaml",
  "rich",
  "typer",
]

[project.scripts]
tokkeeper-audit = "model_audit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_audit"]

[tool.ruff]
extend = "../pyproject.toml"
