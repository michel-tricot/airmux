version: 2
id: reasoning.adaptive
title: Anthropic adaptive reasoning
claims:
- dimension: capability
  name: reasoning
  profile:
    mode: adaptive
  assertion:
    reasoning_present: true
    text_contains: "42"
- dimension: option
  name: reasoning_effort
  profile:
    value: low
  assertion:
    text_contains: "42"
applies_to:
  endpoints: [messages]
request:
  messages:
  - role: user
    content: Reason briefly and answer what is 20 plus 22
  reasoning:
    type: adaptive
    effort: low
oracle:
  text_contains: "42"
