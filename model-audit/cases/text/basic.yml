version: 2
id: text.basic
title: Basic text completion
claims:
- dimension: capability
  name: text_generation
- dimension: modality
  name: input_text
- dimension: modality
  name: output_text
request:
  messages:
  - role: user
    content: Reply with the single word ok
  max_tokens: 1024
oracle:
  text_nonempty: true
