version: 2
id: cache.control
title: Prompt cache breakpoint
claims:
- dimension: interaction
  name: cache_control
  profile:
    type: ephemeral
applies_to:
  endpoints: [messages]
request:
  messages:
  - role: user
    content:
    - type: text
      text: The code word is cobalt.
      cache_control:
        type: ephemeral
    - type: text
      text: "Reply with exactly: cobalt"
oracle:
  text_contains: cobalt
