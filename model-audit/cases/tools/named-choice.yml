version: 2
id: tools.named-choice
title: Named tool choice
claims:
- dimension: option
  name: tool_choice
  profile:
    mode: named
request:
  messages:
  - role: user
    content: Report the value ok
  tools:
  - name: report_result
    description: Report the requested result
    parameters:
      type: object
      properties:
        value:
          type: string
      required: [value]
      additionalProperties: false
  tool_choice:
    name: report_result
oracle:
  assistant_text: forbidden
  tool_names: [report_result]
  tool_arguments_valid: true
