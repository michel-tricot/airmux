# Dependencies only, for local development: the planes run from source (uv run tokkeepercp serve,
# uv run tokkeeperdp) against these. Matches the default database url in tokkeeper.yml.
#   docker compose -f docker-compose.dev.yml up -d --wait
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tokkeeper
      POSTGRES_PASSWORD: tokkeeper
      POSTGRES_DB: tokkeeper
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokkeeper"]
      interval: 5s
      start_period: 10s

volumes:
  pgdata-dev:
