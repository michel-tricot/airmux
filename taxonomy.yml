# Models taxonomy applied with `airllmcp taxonomy`, which also compiles a bundle per org.
#
# All providers here expose OpenAI-compatible chat completions, which is what
# the current openai_compatible adapter (bearer auth, {base_url}/chat/completions)
# supports. A model is only callable once its provider's env key is set; requests
# to the others fail at call time, nothing breaks while keys are absent.
#
# Model list, prices (USD per million tokens, for metering) and context windows
# come from public provider pricing data; regenerate rather than hand-edit.
# Dated snapshots and alias duplicates are dropped.
#
# anthropic uses their OpenAI SDK compatibility layer, which Anthropic documents
# as an evaluation aid rather than a production path; the native Messages adapter
# is milestone M4. Azure OpenAI, Bedrock and Vertex need auth schemes the
# adapter does not speak yet.
#
# icon is the provider mark as a standalone 24x24 SVG, travelling with the catalog
# so a new provider is recognisable without a client release. Taken from
# @lobehub/icons-static-svg 1.94.0 (MIT), normalized: sizing attributes and titles
# dropped so the consumer controls both, gradient ids namespaced. Marks that are
# monochrome by brand are fill="currentColor" and follow the theme; gemini,
# deepseek and mistral carry their brand colors. It is markup, not data: whatever
# renders it sanitizes it.

