kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "bun run --filter @workspace/api-server dev"

[services.production]

[services.production.build]
args = ["bun", "run", "--filter", "@workspace/api-server", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through bun's runner to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
