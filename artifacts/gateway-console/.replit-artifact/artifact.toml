kind = "web"
previewPath = "/"
title = "LLM Gateway Console"
description = "An admin web console for an LLM gateway. Manages organizations, their users, management keys, workspaces, workspace memberships, and inference keys. Built against a placeholder OpenAPI contract so the real backend can be swapped in later."
version = "1.0.0"
id = "artifacts/gateway-console"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20383

[services.development]
run = "bun run --filter @workspace/gateway-console dev"

[services.production]
build = [ "bun", "run", "--filter", "@workspace/gateway-console", "build" ]
serve = "static"
publicDir = "artifacts/gateway-console/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20383"
BASE_PATH = "/"
