control_plane:
  database:
    url: postgresql+asyncpg://airllm:airllm@127.0.0.1:5432/airllm
  bundle:
    signing_key: ${file:.airllm/signing.key}
    staleness_bound_hours: 24

data_plane:
  control_plane:
    url: http://127.0.0.1:8000
    token: ${file:.airllm/dataplane.key}
  bundle:
    public_key: ${file:.airllm/signing.pub}
    cache_dir: .airllm
    staleness_policy: serve_and_warn # or refuse
    poll_interval_s: 5
  events:
    flush_interval_s: 5
