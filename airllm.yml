control_plane:
  database:
    # DATABASE_URL when the host sets one, as Replit's managed PostgreSQL does;
    # otherwise the docker-compose.dev.yml database. A postgresql:// URL gains
    # the asyncpg driver on load, so a managed one can be used as handed over.
    url: ${env:DATABASE_URL}
  bundle:
    # Generate these files with: uv run airllmcp keygen
    signing_key: ${file:.airllm/signing.key}
    staleness_bound_hours: 24

data_plane:
  control_plane:
    url: http://127.0.0.1:8000
    token: ${file:.airllm/dataplane.key}
  bundle:
    # signing.pub is generated alongside signing.key by: uv run airllmcp keygen
    public_key: ${file:.airllm/signing.pub}
    cache_dir: .airllm
    staleness_policy: serve_and_warn # or refuse
    poll_interval_s: 5
  events:
    flush_interval_s: 5
