control_plane:
  database:
    url: postgresql+asyncpg://airllm:airllm@127.0.0.1:5432/airllm
  bundle:
    signing_key: env:GW_BUNDLE_SIGNING_KEY
    staleness_bound_hours: 24

data_plane:
  control_plane:
    url: http://127.0.0.1:8000
    token: env:GW_DATAPLANE_TOKEN
  bundle:
    public_key: env:GW_BUNDLE_PUBLIC_KEY
    org: org-dev
    cache_dir: .airllm
    staleness_policy: serve_and_warn # or refuse
    poll_interval_s: 5
  events:
    flush_interval_s: 5
