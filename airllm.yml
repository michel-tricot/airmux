# Shared gateway config. Secrets are env: references resolved from the
# environment (including .env); never put a raw secret in this file.

control_plane:
  database:
    url: sqlite+aiosqlite:///airllm.db
  auth:
    admin_token: env:GW_ADMIN_TOKEN
    dp_token: env:GW_DP_TOKEN
  signing:
    private_key: env:GW_SIGNING_KEY
  bundle:
    staleness_bound_hours: 24

data_plane:
  control_plane:
    url: http://127.0.0.1:8000
    token: env:GW_DP_TOKEN
    poll_interval_s: 5
  bundle:
    public_key: env:GW_BUNDLE_PUBLIC_KEY
    cache_dir: .airllm
    staleness_policy: serve_and_warn # or refuse
  events:
    flush_interval_s: 5
