# Provider catalog. Data only; every field is defined in the provider-catalog
# skill, see .agents/skills/provider-catalog/references/fields.md

providers:
- id: openai
  name: OpenAI
  icon_mono: openai
  icon_color: openai
  homepage: https://openai.com
  docs: https://platform.openai.com/docs
  base_url: https://api.openai.com/v1
  openapi: https://raw.githubusercontent.com/openai/openai-openapi/master/openapi.yaml
  models_url: https://api.openai.com/v1/models
  ingress:
  - oai
  auth:
  - bearer
  env_var: OPENAI_API_KEY
  schema:
    completion:
      oai:
        request: schemas/completion/oai.openai.request.json
        response: schemas/completion/oai.openai.response.json
        stream: schemas/completion/oai.openai.stream.json
- id: anthropic
  name: Anthropic
  icon_mono: anthropic
  icon_color: anthropic
  homepage: https://www.anthropic.com
  docs: https://platform.claude.com/docs
  base_url: https://api.anthropic.com/v1
  openapi: https://raw.githubusercontent.com/anthropics/anthropic-sdk-typescript/main/.stats.yml
  models_url: https://api.anthropic.com/v1/models
  ingress:
  - anthropic
  auth:
  - header_key:x-api-key
  env_var: ANTHROPIC_API_KEY
  schema:
    completion:
      anthropic:
        request: schemas/completion/anthropic.anthropic.request.json
        response: schemas/completion/anthropic.anthropic.response.json
- id: together
  name: Together AI
  icon_mono: together
  icon_color: together-color
  homepage: https://www.together.ai
  docs: https://docs.together.ai
  base_url: https://api.together.ai/v1
  openapi: https://docs.together.ai/openapi.yaml
  models_url: https://api.together.ai/v1/models
  ingress:
  - oai
  auth:
  - bearer
  env_var: TOGETHER_API_KEY
  schema:
    completion:
      oai:
        request: schemas/completion/oai.together.request.json
        response: schemas/completion/oai.together.response.json
        stream: schemas/completion/oai.together.stream.json
- id: fireworks
  name: Fireworks AI
  icon_mono: fireworks
  icon_color: fireworks-color
  homepage: https://fireworks.ai
  docs: https://docs.fireworks.ai
  base_url: https://api.fireworks.ai/inference/v1
  openapi: null
  models_url: https://api.fireworks.ai/inference/v1/models
  ingress:
  - oai
  auth:
  - bearer
  env_var: FIREWORKS_API_KEY
  schema:
    completion:
      oai:
        request: schemas/completion/oai.fireworks.request.json
- id: groq
  name: Groq
  icon_mono: groq
  icon_color: groq
  homepage: https://groq.com
  docs: https://console.groq.com/docs
  base_url: https://api.groq.com/openai/v1
  openapi: https://raw.githubusercontent.com/groq/groq-python/main/.stats.yml
  models_url: https://api.groq.com/openai/v1/models
  ingress:
  - oai
  auth:
  - bearer
  env_var: GROQ_API_KEY
  schema:
    completion:
      oai:
        request: schemas/completion/oai.groq.request.json
        response: schemas/completion/oai.groq.response.json
