# Providers we are not tracking yet. Identity only: enough to find them again, nothing
# that can rot unnoticed. No schemas, no model catalogs, no icons, and the skill does not
# fetch them.
#
# To promote one, move its entry into providers.yml with the full field set, add a module
# under the skill's sources/, and run the extractors. Everything derived comes back.
#
# A provider is here because we have not validated it with a working account, not because
# it is uninteresting. nvidia is the exception: it was validated, and a key proved its API
# publishes nothing beyond model ids, so it is parked rather than dropped.

candidates:
- id: gemini
  name: Google Gemini
  homepage: https://ai.google.dev
  docs: https://ai.google.dev/gemini-api/docs
  env_var: GEMINI_API_KEY
