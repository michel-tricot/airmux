services:
  - type: web
    name: airllm
    runtime: docker
    plan: 1c-2g
    region: oregon
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh -ec 'export AIRLLM_CONSOLE_URL="${AIRLLM_CONSOLE_URL:-$RENDER_EXTERNAL_URL}"; exec /app/deploy/docker/start.sh all-in-one'
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    disk:
      name: airllm-state
      mountPath: /state
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: airllm-postgres
          property: connectionString
      - key: AIRLLM_CLAIM_TOKEN
        sync: false

databases:
  - name: airllm-postgres
    databaseName: airllm
    user: airllm
    plan: 0.5c-1g
    region: oregon
    postgresMajorVersion: "16"
    diskSizeGB: 10
    ipAllowList: []
