services:
  - type: web
    name: tokkeeper
    runtime: docker
    plan: 1c-2g
    region: oregon
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh -ec 'export TOKKEEPER_CONSOLE_URL="${TOKKEEPER_CONSOLE_URL:-$RENDER_EXTERNAL_URL}"; exec /app/deploy/docker/start.sh all-in-one'
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    disk:
      name: tokkeeper-state
      mountPath: /state
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: tokkeeper-postgres
          property: connectionString

databases:
  - name: tokkeeper-postgres
    databaseName: tokkeeper
    user: tokkeeper
    plan: 0.5c-1g
    region: oregon
    postgresMajorVersion: "16"
    diskSizeGB: 10
    ipAllowList: []
