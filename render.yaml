services:
  - type: web
    name: airmux
    runtime: docker
    plan: 1c-2g
    region: oregon
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    disk:
      name: airmux-state
      mountPath: /state
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: airmux-postgres
          property: connectionString

databases:
  - name: airmux-postgres
    databaseName: airmux
    user: airmux
    plan: 0.5c-1g
    region: oregon
    postgresMajorVersion: "16"
    diskSizeGB: 10
    ipAllowList: []
