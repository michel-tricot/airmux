[project]
name = "provider-parity"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "anthropic",
  "httpx",
  "openai",
  "pydantic>=2",
  "python-dotenv",
  "pyyaml",
  "rich",
  "typer",
]

[project.scripts]
airllm-parity = "provider_parity.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provider_parity"]

[tool.ruff]
extend = "../pyproject.toml"
