name: airllm

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airllm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a URL-safe Postgres password}
      POSTGRES_DB: airllm
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "airllm"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  airllm:
    build:
      context: ../..
      target: all-in-one
    command: ["/app/deploy/docker/start-managed.sh"]
    environment:
      DATABASE_URL: postgresql+asyncpg://airllm:${POSTGRES_PASSWORD:?Set a URL-safe Postgres password}@postgres:5432/airllm
      GW_CONSOLE_URL: https://${AIRLLM_DOMAIN:?Set the public domain}
    volumes:
      - state:/state
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/instance/oss/claim')"]
      interval: 5s
      timeout: 3s
      retries: 30
    stop_grace_period: 40s
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      AIRLLM_DOMAIN: ${AIRLLM_DOMAIN:?Set the public domain}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy-config:/config
    depends_on:
      airllm:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres:
  state:
  certificates:
  caddy-config:
