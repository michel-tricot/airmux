services:
  airmux:
    ports: !reset []
    environment:
      AIRMUX_CONSOLE_URL: https://${AIRMUX_DOMAIN:?Set the public domain}

  caddy:
    image: caddy:2
    environment:
      AIRMUX_DOMAIN: ${AIRMUX_DOMAIN:?Set the public domain}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/digitalocean/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy-config:/config
    depends_on:
      airmux:
        condition: service_healthy
    restart: unless-stopped

volumes:
  certificates:
  caddy-config:
