services:
  tokkeeper:
    ports: !reset []
    environment:
      TOKKEEPER_CONSOLE_URL: https://${TOKKEEPER_DOMAIN:?Set the public domain}

  caddy:
    image: caddy:2
    environment:
      TOKKEEPER_DOMAIN: ${TOKKEEPER_DOMAIN:?Set the public domain}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/digitalocean/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy-config:/config
    depends_on:
      tokkeeper:
        condition: service_healthy
    restart: unless-stopped

volumes:
  certificates:
  caddy-config:
