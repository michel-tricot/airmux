control_plane:
  database:
    url: ${env:DATABASE_URL}
  bootstrap:
    token: ${file:/state/runtime/dataplane.key}
  console_url: ${env:AIRMUX_CONSOLE_URL}
  public_signup: ${env:AIRMUX_PUBLIC_SIGNUP:-false}
  secrets:
    kind: file
    path: /state/secrets

data_plane:
  bundle:
    kind: remote
    control_plane: &control_plane
      url: ${env:AIRMUX_DATAPLANE_CONTROL_PLANE_URL:-http://control-plane:8000}
      management_key: ${file:/state/runtime/dataplane.key}
    cache_dir: /state/data-plane
    poll_interval_s: 5
    heartbeat_interval_s: 30
  events:
    kind: sqlite
    control_plane: *control_plane
    cache_dir: /state/data-plane
    flush_interval_s: 5
  secrets:
    kind: file
    path: /state/secrets
