global
  log stdout format raw local0

defaults
  log global
  mode http
  option httplog
  timeout connect 2s
  timeout client 310s
  timeout server 310s

resolvers docker
  nameserver docker 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 5s

frontend inference
  bind :8081
  acl no_ready nbsrv(data_planes) eq 0
  acl readiness path /readyz
  http-request return status 503 content-type application/json string '{"status":"no bundle"}' if readiness no_ready
  http-request return status 503 content-type application/json string '{"error":{"code":"bundle_unavailable","message":""}}' if no_ready
  default_backend data_planes

backend data_planes
  option httpchk GET /readyz
  option redispatch
  http-check expect status 200
  retries 1
  default-server check inter 1s fall 1 rise 1 resolvers docker init-addr last,libc,none
  server data-plane-1 data-plane-1:8081
  server data-plane-2 data-plane-2:8081
