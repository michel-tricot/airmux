control_plane:
  database:
    url: ${env:DATABASE_URL}
  bootstrap:
    token: ${file:/state/runtime/dataplane.key}
  console_url: ${env:AIRLLM_CONSOLE_URL}
  claim_token: ${env:AIRLLM_CLAIM_TOKEN}
  secrets:
    kind: file
    root: /state/secrets

data_plane:
  bundle:
    kind: remote
    control_plane: &control_plane
      url: ${env:AIRLLM_DATAPLANE_CONTROL_PLANE_URL:-http://control-plane:8000}
      token: ${file:/state/runtime/dataplane.key}
    cache_dir: /state/data-plane
    poll_interval_s: 5
    heartbeat_interval_s: 30
  events:
    kind: sqlite
    control_plane: *control_plane
    cache_dir: /state/data-plane
    flush_interval_s: 5
  secrets:
    kind: file
    root: /state/secrets
