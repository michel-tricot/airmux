data_plane:
  bundle:
    kind: remote
    control_plane: &control_plane
      url: ${env:GW_DATAPLANE_CONTROL_PLANE_URL}
      token: ${env:GW_DATAPLANE_TOKEN}
    cache_dir: /state/data-plane
    poll_interval_s: 5
    heartbeat_interval_s: 30
  events:
    kind: sqlite
    control_plane: *control_plane
    cache_dir: /state/data-plane
    flush_interval_s: 5
  secrets:
    kind: env
