primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "../../Dockerfile"

[env]
  GW_CONFIG = "/app/deploy/fly/airllm.yml"

[processes]
  app = "/app/deploy/fly/start-backend.sh"

[deploy]
  release_command = "airllmcp migrate --config /app/deploy/fly/migrate.yml"
  strategy = "rolling"
  wait_timeout = "10m"

[[services]]
  internal_port = 8000
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[services.ports]]
    handlers = ["http"]
    port = 8000

  [[services.http_checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    protocol = "http"
    timeout = "5s"

[[services]]
  internal_port = 8081
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[services.ports]]
    handlers = ["http"]
    port = 8081

[mounts]
  source = "airllm_state"
  destination = "/state"
  initial_size = "1gb"
  snapshot_retention = 7

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
