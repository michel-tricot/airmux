# The hand-written bundle for the standalone data plane.
# Keys are plaintext here and hashed at load; treat this file like the secrets it guards.
# Prices and limits copied from taxonomy.yml, 2026-08-14.

keys:
  - sk-inf-standalone-dev

providers:
  - provider_id: openai
    kind: openai_compatible
    base_url: https://api.openai.com/v1
    # The gpt-5 family rejects max_tokens; the profile re-spells it, no code involved.
    param_aliases:
      max_tokens: max_completion_tokens
    # OpenAI rejects unknown params outright, so the schema is closed and the real extras are
    # declared; anything else (an Anthropic caller's thinking, say) drops with an adjustment.
    params_closed: true
    accepted_params:
      [frequency_penalty, presence_penalty, logit_bias, logprobs, top_logprobs, user, store, parallel_tool_calls, reasoning_effort, verbosity, service_tier, prediction]
  - provider_id: anthropic
    kind: anthropic
    base_url: https://api.anthropic.com/v1
    # The native schema is closed; these are the extras it accepts beyond the core.
    params_closed: true
    accepted_params: [top_k, thinking, metadata, service_tier]
  - provider_id: groq
    kind: openai_compatible
    base_url: https://api.groq.com/openai/v1

models:
  - model_id: gpt-5.2
    provider_id: openai
    upstream_model: gpt-5.2
    input_price_per_mtok: 1.75
    output_price_per_mtok: 14.0
    cache_read_price_per_mtok: 0.875
    cache_write_price_per_mtok: 1.75
    context_window: 272000
    max_output_tokens: 128000
    capabilities: [streaming, tools, vision]
  - model_id: gpt-5.4-mini
