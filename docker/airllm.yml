control_plane:
  database:
    url: postgresql+asyncpg://airllm:airllm@postgres:5432/airllm
  bundle:
    signing_key: ${env:GW_BUNDLE_SIGNING_KEY}
    staleness_bound_hours: 24
  console_url: http://localhost:3000

data_plane:
  control_plane:
    url: http://control-plane:8000
    token: ${env:GW_DATAPLANE_TOKEN}
  bundle:
    public_key: ${env:GW_BUNDLE_PUBLIC_KEY}
    cache_dir: /state/.airllm
    staleness_policy: serve_and_warn # or refuse
    poll_interval_s: 5
  events:
    flush_interval_s: 5
