x-gateway: &gateway
  image: ${AIRMUX_DATA_PLANE_IMAGE:-airmux-data-plane:local}
  init: true
  depends_on:
    control-plane:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz')"]
    interval: 5s
    timeout: 3s
    retries: 20
  networks:
    default:
      aliases: [data-plane]
  stop_grace_period: 40s
  restart: unless-stopped

services:
  postgres:
    extends:
      file: docker-compose.yml
      service: postgres
    volumes:
      - split-pgdata:/var/lib/postgresql/data

  control-plane:
    image: ${AIRMUX_CONTROL_PLANE_IMAGE:-airmux-control-plane:local}
    build:
      context: .
      target: control-plane
      args:
        AIRMUX_PYTHON_BUILD: ${AIRMUX_PYTHON_BUILD:-python-build}
    environment:
      DATABASE_URL: postgresql+asyncpg://airmux:${POSTGRES_PASSWORD:-airmux}@postgres:5432/airmux
      AIRMUX_CONSOLE_URL: ${AIRMUX_PUBLIC_URL:-http://localhost:8080}
      AIRMUX_PUBLIC_SIGNUP: ${AIRMUX_PUBLIC_SIGNUP:-false}
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - runtime-credentials:/state/runtime
      - provider-secrets:/state/secrets
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  data-plane-1:
    <<: *gateway
    build:
      context: .
      target: data-plane
      args:
        AIRMUX_PYTHON_BUILD: ${AIRMUX_PYTHON_BUILD:-python-build}
    volumes:
      - runtime-credentials:/state/runtime:ro
      - provider-secrets:/state/secrets:ro
      - gateway-1:/state/data-plane

  data-plane-2:
    <<: *gateway
    volumes:
      - runtime-credentials:/state/runtime:ro
      - provider-secrets:/state/secrets:ro
      - gateway-2:/state/data-plane

  console:
    image: ${AIRMUX_CONSOLE_IMAGE:-airmux-console:local}
    build:
      context: .
      target: console
    environment:
      AIRMUX_CONSOLE_URL: ${AIRMUX_PUBLIC_URL:-http://localhost:8080}
    ports:
      - "${AIRMUX_PORT:-8080}:8080"
    depends_on:
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  split-pgdata:
  runtime-credentials:
  provider-secrets:
  gateway-1:
  gateway-2:
