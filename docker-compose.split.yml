x-gateway: &gateway
  image: ${TOKKEEPER_DATA_PLANE_IMAGE:-tokkeeper-data-plane:local}
  init: true
  depends_on:
    control-plane:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz')"]
    interval: 5s
    timeout: 3s
    retries: 20
  stop_grace_period: 40s
  restart: unless-stopped

services:
  postgres:
    extends:
      file: docker-compose.yml
      service: postgres
    volumes:
      - split-pgdata:/var/lib/postgresql/data

  control-plane:
    image: ${TOKKEEPER_CONTROL_PLANE_IMAGE:-tokkeeper-control-plane:local}
    build:
      context: .
      target: control-plane
    environment:
      DATABASE_URL: postgresql+asyncpg://tokkeeper:${POSTGRES_PASSWORD:-tokkeeper}@postgres:5432/tokkeeper
      TOKKEEPER_CONSOLE_URL: ${TOKKEEPER_PUBLIC_URL:-http://localhost:8080}
      TOKKEEPER_PUBLIC_SIGNUP: ${TOKKEEPER_PUBLIC_SIGNUP:-false}
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - runtime-credentials:/state/runtime
      - provider-secrets:/state/secrets
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  data-plane-1:
    <<: *gateway
    build:
      context: .
      target: data-plane
    volumes:
      - runtime-credentials:/state/runtime:ro
      - provider-secrets:/state/secrets:ro
      - gateway-1:/state/data-plane

  data-plane-2:
    <<: *gateway
    volumes:
      - runtime-credentials:/state/runtime:ro
      - provider-secrets:/state/secrets:ro
      - gateway-2:/state/data-plane

  inference-router:
    image: ${TOKKEEPER_INFERENCE_ROUTER_IMAGE:-haproxy:3.2-alpine}
    user: "10001:10001"
    read_only: true
    volumes:
      - ./deploy/docker/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      data-plane-1:
        condition: service_started
      data-plane-2:
        condition: service_started
    restart: unless-stopped

  console:
    image: ${TOKKEEPER_CONSOLE_IMAGE:-tokkeeper-console:local}
    build:
      context: .
      target: console
    environment:
      TOKKEEPER_CONSOLE_URL: ${TOKKEEPER_PUBLIC_URL:-http://localhost:8080}
      DATA_PLANE_UPSTREAM: inference-router:8081
    ports:
      - "${TOKKEEPER_PORT:-8080}:8080"
    depends_on:
      control-plane:
        condition: service_healthy
      inference-router:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  split-pgdata:
  runtime-credentials:
  provider-secrets:
  gateway-1:
  gateway-2:
