x-gateway: &gateway
  image: ${AIRMUX_IMAGE:-airmux:local}
  command: data-plane
  environment:
    AIRMUX_DATAPLANE_CONTROL_PLANE_URL: http://control-plane:8000
  depends_on:
    control-plane:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/metrics')"]
    interval: 5s
    timeout: 3s
    retries: 20
  networks:
    default:
      aliases: [data-plane]
  stop_grace_period: 40s
  restart: unless-stopped

services:
  postgres:
    extends:
      file: docker-compose.yml
      service: postgres
    volumes:
      - split-pgdata:/var/lib/postgresql/data

  migrate:
    extends:
      file: docker-compose.yml
      service: migrate

  taxonomy:
    extends:
      file: docker-compose.yml
      service: taxonomy

  control-plane:
    image: ${AIRMUX_IMAGE:-airmux:local}
    command: control-plane
    environment:
      DATABASE_URL: postgresql+asyncpg://airmux:${POSTGRES_PASSWORD:-airmux}@postgres:5432/airmux
      AIRMUX_CONSOLE_URL: ${AIRMUX_PUBLIC_URL:-http://localhost:8080}
      AIRMUX_PUBLIC_SIGNUP: ${AIRMUX_PUBLIC_SIGNUP:-false}
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - runtime-credentials:/state/runtime
      - provider-secrets:/state/secrets
      - ./airmux-config:/config:ro
    depends_on:
      taxonomy:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 30
    stop_grace_period: 40s
    restart: unless-stopped

  data-plane-1:
    <<: *gateway
    image: ${AIRMUX_IMAGE:-airmux:local}
    volumes:
      - runtime-credentials:/state/runtime:ro
      - provider-secrets:/state/secrets:ro
      - gateway-1:/state/data-plane
      - ./airmux-config:/config:ro

  data-plane-2:
    <<: *gateway
    image: ${AIRMUX_IMAGE:-airmux:local}
    volumes:
      - runtime-credentials:/state/runtime:ro
      - provider-secrets:/state/secrets:ro
      - gateway-2:/state/data-plane
      - ./airmux-config:/config:ro

  console:
    image: ${AIRMUX_IMAGE:-airmux:local}
    command: console
    environment:
      AIRMUX_CONSOLE_URL: ${AIRMUX_PUBLIC_URL:-http://localhost:8080}
      CONTROL_PLANE_UPSTREAM: control-plane:8000
      DATA_PLANE_UPSTREAM: data-plane:8081
    ports:
      - "${AIRMUX_PORT:-8080}:8080"
    depends_on:
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/instance/oss/claim')"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 40s
    restart: unless-stopped

volumes:
  split-pgdata:
  runtime-credentials:
  provider-secrets:
  gateway-1:
  gateway-2:
