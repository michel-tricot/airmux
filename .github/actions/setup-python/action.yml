name: Set up locked Python workspace
description: Install Python and synchronize the frozen workspace
inputs:
  python-version:
    description: Python version
    default: '3.13'
  cache:
    description: Enable the setup-uv dependency cache
    default: 'true'
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      with:
        enable-cache: ${{ inputs.cache }}
        python-version: ${{ inputs.python-version }}
    - run: uv sync --all-packages --locked
      shell: bash
