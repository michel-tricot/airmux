name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run codegen && git diff --exit-code lib/api-client-react lib/api-zod
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run coverage
      - run: bun run --filter '@workspace/gateway-console' build

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.13'
      - run: uv sync --all-packages --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check .
      - run: uv run lint-imports
      - run: ./scripts/export-openapi.sh && git diff --exit-code lib/api-spec/openapi.yaml
      - run: ./scripts/generate-api-models.sh && git diff --exit-code lib/api-models
      - run: ./scripts/export-completion-schemas.sh && git diff --exit-code taxonomy/schemas/completion
      - run: uv run airllm-audit cases coverage
      - run: uv run airllm-audit taxonomy validate
      - run: uv run pytest model-audit/catalog/tests
      - run: uv run pytest -n auto

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.13'
      - run: uv sync --all-packages --frozen
      - run: uv run pytest tests/acceptance/scenarios

  # Off by default: the numbers are host bound, and a shared runner loses requests under the
  # higher concurrency levels, so this has never passed here. Run it from the Actions tab, or
  # locally with uv run pytest tests/acceptance/benchmarks, where the table is the point.
  benchmarks:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run pytest tests/acceptance/benchmarks
