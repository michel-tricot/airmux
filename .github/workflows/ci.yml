name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run codegen && git diff --exit-code lib/api-client-react lib/api-zod
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run coverage
      - run: bun run --filter '@workspace/gateway-console' build

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.13'
      - run: uv sync --all-packages --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check .
      - run: uv run lint-imports
      - run: ./scripts/export-openapi.sh && git diff --exit-code lib/api-spec/openapi.yaml
      - run: ./scripts/generate-api-models.sh && git diff --exit-code lib/api-models
      - run: ./scripts/export-completion-schemas.sh && git diff --exit-code taxonomy/schemas/completion
      - run: uv run tokkeeper-audit cases coverage
      - run: uv run tokkeeper-audit taxonomy validate
      - run: uv run pytest model-audit/catalog/tests
      - run: uv run pytest apps/control-plane/tests/unit
        env:
          DOCKER_HOST: unix:///tmp/tokkeeper-no-docker.sock
      - run: uv run pytest -n auto --ignore=apps/control-plane/tests/unit

  gateway:
    runs-on: ubuntu-latest
    env:
      UV_TOOL_DIR: ${{ runner.temp }}/gateway-tools
      UV_TOOL_BIN_DIR: ${{ runner.temp }}/gateway-bin
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - run: uv sync --all-packages --frozen
      - run: uv build --package contract --wheel && uv build --package data-plane --wheel
      - run: uv tool install --with ./dist/contract-0.1.0-py3-none-any.whl ./dist/data_plane-0.1.0-py3-none-any.whl
      - name: Verify independent installation
        run: |
          "$UV_TOOL_DIR/data-plane/bin/python" -c 'from importlib.util import find_spec; assert all(find_spec(name) is None for name in ("control_plane", "fastapi", "sqlalchemy", "sqlmodel", "alembic"))'
      - run: uv run pytest tests/gateway
        env:
          TOKKEEPER_GATEWAY_BIN: ${{ runner.temp }}/gateway-bin/tokkeeper-data-plane
          DOCKER_HOST: unix:///no-docker.sock

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.13'
      - run: uv sync --all-packages --frozen
      - run: uv run pytest tests/acceptance/scenarios

  # Off by default: the numbers are host bound, and a shared runner loses requests under the
  # higher concurrency levels, so this has never passed here. Run it from the Actions tab, or
  # locally with uv run pytest tests/acceptance/benchmarks, where the table is the point.
  benchmarks:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run pytest tests/acceptance/benchmarks
