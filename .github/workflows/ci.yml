name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [workflows, frontend, ci, installation, gateway-acceptance, acceptance]
    if: always()
    steps:
      - name: Require every correctness job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$NEEDS"

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate workflows and embedded shell
        run: |
          command -v shellcheck
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/actionlint" -color
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: false
          python-version: '3.13'
      - name: Check pinned action inputs and security boundaries
        env:
          AIRMUX_VALIDATE_ACTION_INPUTS: '1'
        run: uv run --no-sync --frozen pytest tests/workflows -q
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx --no-install prettier --check '.github/workflows/*.{yml,yaml}'

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run codegen && git diff --exit-code lib/api-client-react
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run coverage
      - run: bun run --filter '@workspace/gateway-console' build

  ci:
    runs-on: ubuntu-latest
    env:
      UV_NO_SYNC: 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: true
          python-version: '3.13'
      - run: uv sync --all-packages --locked
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ty check .
      - run: uv run --no-sync lint-imports
      - run: ./scripts/export-openapi.sh && git diff --exit-code lib/api-spec/openapi.yaml
      - run: ./scripts/generate-api-models.sh && git diff --exit-code lib/api-models
      - run: ./scripts/export-completion-schemas.sh && git diff --exit-code taxonomy/schemas/completion
      - run: uv run --no-sync airmux-audit cases coverage
      - run: uv run --no-sync airmux-audit taxonomy validate
      - run: uv run --no-sync pytest apps/control-plane/tests/unit --junitxml=backend-results/unit.xml
        env:
          DOCKER_HOST: unix:///tmp/airmux-no-docker.sock
      - run: uv run --no-sync pytest -n auto --ignore=apps/control-plane/tests/unit --junitxml=backend-results/integration.xml
      - name: Summarize backend test results
        if: always()
        continue-on-error: true
        run: uv run --no-sync python tests/acceptance/gateway/ci_report.py backend-results --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload backend test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: backend-test-results
          path: backend-results/*.xml
          retention-days: 7
      - name: Verify workspace lockfile is unchanged
        if: always()
        run: git diff --exit-code -- uv.lock

  installation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: '3.13'
      - name: Configure installed gateway test paths
        run: |
          echo "AIRMUX_GATEWAY_BIN=$RUNNER_TEMP/airmux-bin/airmux" >> "$GITHUB_ENV"
          echo "AIRMUX_GATEWAY_ARTIFACTS=$RUNNER_TEMP/gateway-artifacts" >> "$GITHUB_ENV"
      - run: uv sync --all-packages --locked
      - run: ./scripts/build-python-distribution.sh
      - name: Rebuild wheel from source distribution
        run: |
          mkdir dist-from-sdist
          uv build --wheel --out-dir dist-from-sdist dist/airmux-*.tar.gz
      - name: Install rebuilt release
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/airmux-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/airmux-bin
        run: uv tool install dist-from-sdist/airmux-*.whl
      - run: uv run --no-sync pytest tests/installation --junitxml=gateway-results/00-installation.xml
        env:
          AIRMUX_DISTRIBUTION_DIR: dist
          AIRMUX_INSTALL_BIN: ${{ runner.temp }}/airmux-bin/airmux
      - name: Disable Docker for standalone gateway tests
        run: echo "DOCKER_HOST=unix:///no-docker.sock" >> "$GITHUB_ENV"
      - name: Verify gateway CI reporting and performance comparisons
        run: uv run --no-sync pytest tests/acceptance/test_diagnostics.py tests/acceptance/gateway/test_ci_report.py tests/acceptance/gateway/test_performance.py tests/acceptance/gateway/test_live_provider_setup.py --junitxml=gateway-results/00-reporting.xml
      - name: Summarize gateway test results
        if: always()
        run: uv run --no-sync python tests/acceptance/gateway/ci_report.py gateway-results --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload gateway results and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gateway-integration-installation
          path: |
            gateway-results
            ${{ runner.temp }}/gateway-artifacts
          retention-days: 7
      - name: Verify workspace lockfile is unchanged
        if: always()
        run: git diff --exit-code -- uv.lock

  gateway-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - level: 01-basic
            tests: tests/acceptance/gateway/test_01_basic.py
          - level: 02-protocols
            tests: tests/acceptance/gateway/test_02_protocols.py tests/acceptance/gateway/test_openai_sdk.py
          - level: 03-features
            tests: tests/acceptance/gateway/test_03_features.py
          - level: 04-policies
            tests: tests/acceptance/gateway/test_04_policies.py
          - level: 05-advanced-policies
            tests: tests/acceptance/gateway/test_05_advanced_policies.py
          - level: 06-failures
            tests: tests/acceptance/gateway/test_06_failures.py
          - level: 07-runtime
            tests: tests/acceptance/gateway/test_07_runtime.py tests/acceptance/gateway/test_gateway.py tests/acceptance/gateway/test_local_mode.py
          - level: 08-metering
            tests: tests/acceptance/gateway/test_08_metering.py
    env:
      DOCKER_HOST: unix:///no-docker.sock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: true
          python-version: '3.13'
      - run: uv sync --all-packages --locked
      - run: ./scripts/build-python-distribution.sh
      - name: Rebuild wheel from source distribution
        run: |
          mkdir dist-from-sdist
          uv build --wheel --out-dir dist-from-sdist dist/airmux-*.tar.gz
      - name: Install rebuilt release
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/airmux-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/airmux-bin
        run: uv tool install dist-from-sdist/airmux-*.whl
      - name: Run gateway level
        run: uv run --no-sync pytest ${{ matrix.tests }} -n auto --junitxml=gateway-results/${{ matrix.level }}.xml
        env:
          AIRMUX_GATEWAY_BIN: ${{ runner.temp }}/airmux-bin/airmux
          AIRMUX_GATEWAY_ARTIFACTS: ${{ runner.temp }}/gateway-artifacts
      - name: Summarize gateway test results
        if: always()
        run: uv run --no-sync python tests/acceptance/gateway/ci_report.py gateway-results --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload gateway results and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gateway-integration-${{ matrix.level }}
          path: |
            gateway-results
            ${{ runner.temp }}/gateway-artifacts
          retention-days: 7
      - name: Verify workspace lockfile is unchanged
        if: always()
        run: git diff --exit-code -- uv.lock

  gateway-results:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [installation, gateway-acceptance]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: true
          python-version: '3.13'
      - run: uv sync --all-packages --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: gateway-integration-*
          path: gateway-results
      - name: Summarize all gateway test results
        run: uv run --no-sync python tests/acceptance/gateway/ci_report.py gateway-results --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload combined gateway results and diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gateway-integration
          path: gateway-results
          retention-days: 7
      - name: Verify workspace lockfile is unchanged
        if: always()
        run: git diff --exit-code -- uv.lock

  gateway-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || 'main' }}
      CANDIDATE_REVISION: ${{ github.sha }}
      DOCKER_HOST: unix:///no-docker.sock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: performance-candidate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ env.BASE_REVISION }}
          path: performance-base
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: true
          python-version: '3.13'
      - run: uv sync --all-packages --locked
        working-directory: performance-candidate
      - name: Build and install base gateway
        working-directory: performance-base
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/performance-base-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/performance-base-bin
        run: |
          ./scripts/build-python-distribution.sh "$RUNNER_TEMP/performance-base-dist"
          uv tool install --python 3.13 "$RUNNER_TEMP"/performance-base-dist/airmux-*.whl
      - name: Build and install candidate gateway
        working-directory: performance-candidate
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/performance-candidate-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/performance-candidate-bin
        run: |
          ./scripts/build-python-distribution.sh "$RUNNER_TEMP/performance-candidate-dist"
          uv tool install --python 3.13 "$RUNNER_TEMP"/performance-candidate-dist/airmux-*.whl
      - name: Compare gateway performance
        working-directory: performance-candidate
        run: |
          uv run --no-sync python tests/acceptance/gateway/performance.py \
            --base-bin "$RUNNER_TEMP/performance-base-bin/airmux" \
            --base-harness ../performance-base/tests/acceptance/gateway \
            --candidate-bin "$RUNNER_TEMP/performance-candidate-bin/airmux" \
            --base-revision "$(git -C ../performance-base rev-parse HEAD)" \
            --candidate-revision "$CANDIDATE_REVISION" \
            --output "$RUNNER_TEMP/performance-results"
      - name: Upload gateway performance history
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gateway-performance
          path: |
            ${{ runner.temp }}/performance-results/measurements.json
            ${{ runner.temp }}/performance-results/summary.md
          retention-days: 90
      - name: Verify workspace lockfile is unchanged
        if: always()
        run: git diff --exit-code -- uv.lock
        working-directory: performance-candidate

  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: true
          python-version: '3.13'
      - run: uv sync --all-packages --locked
      - run: uv run --no-sync pytest tests/acceptance/full_stack/scenarios --junitxml=acceptance-results/full-stack.xml
        env:
          AIRMUX_STACK_ARTIFACTS: ${{ runner.temp }}/full-stack-artifacts
      - name: Summarize full-stack acceptance results
        if: always()
        continue-on-error: true
        run: uv run --no-sync python tests/acceptance/gateway/ci_report.py acceptance-results --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload full-stack acceptance results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-stack-acceptance
          path: |
            acceptance-results/*.xml
            ${{ runner.temp }}/full-stack-artifacts
          retention-days: 7
      - name: Verify workspace lockfile is unchanged
        if: always()
        run: git diff --exit-code -- uv.lock
