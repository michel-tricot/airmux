name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run codegen && git diff --exit-code lib/api-client-react
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run coverage
      - run: bun run --filter '@workspace/gateway-console' build

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.13'
      - run: uv sync --all-packages --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check .
      - run: uv run lint-imports
      - run: ./scripts/export-openapi.sh && git diff --exit-code lib/api-spec/openapi.yaml
      - run: ./scripts/generate-api-models.sh && git diff --exit-code lib/api-models
      - run: ./scripts/export-completion-schemas.sh && git diff --exit-code taxonomy/schemas/completion
      - run: uv run airmux-audit cases coverage
      - run: uv run airmux-audit taxonomy validate
      - run: uv run pytest apps/control-plane/tests/unit
        env:
          DOCKER_HOST: unix:///tmp/airmux-no-docker.sock
      - run: uv run pytest -n auto --ignore=apps/control-plane/tests/unit

  installation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - name: Configure installed gateway test paths
        run: |
          echo "AIRMUX_GATEWAY_BIN=$RUNNER_TEMP/airmux-bin/airmux" >> "$GITHUB_ENV"
          echo "AIRMUX_GATEWAY_ARTIFACTS=$RUNNER_TEMP/gateway-artifacts" >> "$GITHUB_ENV"
      - run: uv sync --all-packages --frozen
      - run: ./scripts/build-python-distribution.sh
      - name: Rebuild wheel from source distribution
        run: |
          mkdir dist-from-sdist
          uv build --wheel --out-dir dist-from-sdist dist/airmux-*.tar.gz
      - name: Install rebuilt release
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/airmux-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/airmux-bin
        run: uv tool install dist-from-sdist/airmux-*.whl
      - run: uv run pytest tests/installation --junitxml=gateway-results/00-installation.xml
        env:
          AIRMUX_DISTRIBUTION_DIR: dist
          AIRMUX_INSTALL_BIN: ${{ runner.temp }}/airmux-bin/airmux
      - name: Disable Docker for standalone gateway tests
        run: echo "DOCKER_HOST=unix:///no-docker.sock" >> "$GITHUB_ENV"
      - name: Verify gateway CI reporting and performance comparisons
        run: uv run pytest tests/acceptance/gateway/test_ci_report.py tests/acceptance/gateway/test_performance.py tests/acceptance/gateway/test_live_provider_setup.py --junitxml=gateway-results/00-reporting.xml
      - name: Gateway level 1 - basics
        run: uv run pytest tests/acceptance/gateway/test_01_basic.py -n auto --junitxml=gateway-results/01-basic.xml
      - name: Gateway level 2 - protocols
        run: uv run pytest tests/acceptance/gateway/test_02_protocols.py tests/acceptance/gateway/test_openai_sdk.py -n auto --junitxml=gateway-results/02-protocols.xml
      - name: Gateway level 3 - features
        run: uv run pytest tests/acceptance/gateway/test_03_features.py -n auto --junitxml=gateway-results/03-features.xml
      - name: Gateway level 4 - policies
        run: uv run pytest tests/acceptance/gateway/test_04_policies.py -n auto --junitxml=gateway-results/04-policies.xml
      - name: Gateway level 5 - advanced policies
        run: uv run pytest tests/acceptance/gateway/test_05_advanced_policies.py -n auto --junitxml=gateway-results/05-advanced-policies.xml
      - name: Gateway level 6 - failures and fallback
        run: uv run pytest tests/acceptance/gateway/test_06_failures.py -n auto --junitxml=gateway-results/06-failures.xml
      - name: Gateway level 7 - runtime and CLI lifecycle
        run: uv run pytest tests/acceptance/gateway/test_07_runtime.py tests/acceptance/gateway/test_gateway.py tests/acceptance/gateway/test_local_mode.py -n auto --junitxml=gateway-results/07-runtime.xml
      - name: Gateway level 8 - metering and pricing
        run: uv run pytest tests/acceptance/gateway/test_08_metering.py -n auto --junitxml=gateway-results/08-metering.xml
      - name: Summarize gateway test results
        if: always()
        run: uv run python tests/acceptance/gateway/ci_report.py gateway-results --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload gateway results and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gateway-integration
          path: |
            gateway-results
            ${{ runner.temp }}/gateway-artifacts
          retention-days: 7

  gateway-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || 'main' }}
      CANDIDATE_REVISION: ${{ github.sha }}
      DOCKER_HOST: unix:///no-docker.sock
    steps:
      - uses: actions/checkout@v7
        with:
          path: performance-candidate
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_REVISION }}
          path: performance-base
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.13'
      - run: uv sync --all-packages --frozen
        working-directory: performance-candidate
      - name: Build and install base gateway
        working-directory: performance-base
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/performance-base-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/performance-base-bin
        run: |
          ./scripts/build-python-distribution.sh "$RUNNER_TEMP/performance-base-dist"
          uv tool install --python 3.13 "$RUNNER_TEMP"/performance-base-dist/*.whl
      - name: Build and install candidate gateway
        working-directory: performance-candidate
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/performance-candidate-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/performance-candidate-bin
        run: |
          ./scripts/build-python-distribution.sh "$RUNNER_TEMP/performance-candidate-dist"
          uv tool install --python 3.13 "$RUNNER_TEMP"/performance-candidate-dist/airmux-*.whl
      - name: Compare gateway performance
        working-directory: performance-candidate
        run: |
          uv run python tests/acceptance/gateway/performance.py \
            --base-bin "$(find "$RUNNER_TEMP/performance-base-bin" -maxdepth 1 -type f -perm -u+x)" \
            --candidate-bin "$RUNNER_TEMP/performance-candidate-bin/airmux" \
            --base-revision "$(git -C ../performance-base rev-parse HEAD)" \
            --candidate-revision "$CANDIDATE_REVISION" \
            --output "$RUNNER_TEMP/performance-results"
      - name: Upload gateway performance history
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gateway-performance
          path: |
            ${{ runner.temp }}/performance-results/measurements.json
            ${{ runner.temp }}/performance-results/summary.md
          retention-days: 90

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.13'
      - run: uv sync --all-packages --frozen
      - run: uv run pytest tests/acceptance/full_stack/scenarios --junitxml=acceptance-results/full-stack.xml
      - name: Summarize full-stack acceptance results
        if: always()
        run: uv run python tests/acceptance/gateway/ci_report.py acceptance-results --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload full-stack acceptance results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-stack-acceptance
          path: acceptance-results
          retention-days: 7
