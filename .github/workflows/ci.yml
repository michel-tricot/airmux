name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run codegen && git diff --exit-code lib/api-client-react
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run coverage
      - run: bun run --filter '@workspace/gateway-console' build

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.13'
      - run: uv sync --all-packages --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check .
      - run: uv run lint-imports
      - run: ./scripts/export-openapi.sh && git diff --exit-code lib/api-spec/openapi.yaml
      - run: ./scripts/generate-api-models.sh && git diff --exit-code lib/api-models
      - run: ./scripts/export-completion-schemas.sh && git diff --exit-code taxonomy/schemas/completion
      - run: uv run tokkeeper-audit cases coverage
      - run: uv run tokkeeper-audit taxonomy validate
      - run: uv run pytest apps/control-plane/tests/unit
        env:
          DOCKER_HOST: unix:///tmp/tokkeeper-no-docker.sock
      - run: uv run pytest -n auto --ignore=apps/control-plane/tests/unit

  installation:
    runs-on: ubuntu-latest
    env:
      TOKKEEPER_GATEWAY_BIN: ${{ runner.temp }}/tokkeeper-bin/tokkeeper
      TOKKEEPER_GATEWAY_ARTIFACTS: ${{ runner.temp }}/gateway-artifacts
      DOCKER_HOST: unix:///no-docker.sock
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - run: uv sync --all-packages --frozen
      - run: ./scripts/build-python-distribution.sh
      - name: Rebuild wheel from source distribution
        run: |
          mkdir dist-from-sdist
          uv build --wheel --out-dir dist-from-sdist dist/tokkeeper-*.tar.gz
      - name: Install rebuilt release
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/tokkeeper-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/tokkeeper-bin
        run: uv tool install dist-from-sdist/tokkeeper-*.whl
      - run: uv run pytest tests/installation
        env:
          TOKKEEPER_DISTRIBUTION_DIR: dist
          TOKKEEPER_INSTALL_BIN: ${{ runner.temp }}/tokkeeper-bin/tokkeeper
      - name: Gateway level 1 - basics
        run: uv run pytest tests/gateway/test_01_basic.py -n auto --junitxml=gateway-results/01-basic.xml
      - name: Gateway level 2 - protocols
        run: uv run pytest tests/gateway/test_02_protocols.py -n auto --junitxml=gateway-results/02-protocols.xml
      - name: Gateway level 3 - features
        run: uv run pytest tests/gateway/test_03_features.py -n auto --junitxml=gateway-results/03-features.xml
      - name: Gateway level 4 - policies
        run: uv run pytest tests/gateway/test_04_policies.py -n auto --junitxml=gateway-results/04-policies.xml
      - name: Gateway level 5 - advanced policies
        run: uv run pytest tests/gateway/test_05_advanced_policies.py -n auto --junitxml=gateway-results/05-advanced-policies.xml
      - name: Gateway level 6 - failures and fallback
        run: uv run pytest tests/gateway/test_06_failures.py -n auto --junitxml=gateway-results/06-failures.xml
      - name: Gateway level 7 - runtime and CLI lifecycle
        run: uv run pytest tests/gateway/test_07_runtime.py tests/gateway/test_gateway.py -n auto --junitxml=gateway-results/07-runtime.xml
      - name: Upload gateway results and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gateway-integration
          path: |
            gateway-results
            ${{ runner.temp }}/gateway-artifacts
          retention-days: 7

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.13'
      - run: uv sync --all-packages --frozen
      - run: uv run pytest tests/acceptance/scenarios

  # Off by default: the numbers are host bound, and a shared runner loses requests under the
  # higher concurrency levels, so this has never passed here. Run it from the Actions tab, or
  # locally with uv run pytest tests/acceptance/benchmarks, where the table is the point.
  benchmarks:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run pytest tests/acceptance/benchmarks
