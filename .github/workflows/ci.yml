name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check .
      - run: uv run lint-imports
      - run: ./scripts/export-openapi.sh && git diff --exit-code lib/api-spec/openapi.yaml
      - run: ./scripts/generate-api-models.sh && git diff --exit-code lib/api-models
      - run: ./scripts/export-completion-schemas.sh && git diff --exit-code taxonomy/schemas/completion
      - run: uv run pytest -n auto

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run pytest tests/acceptance/scenarios

  # Off by default: the numbers are host bound, and a shared runner loses requests under the
  # higher concurrency levels, so this has never passed here. Run it from the Actions tab, or
  # locally with uv run pytest tests/acceptance/benchmarks, where the table is the point.
  benchmarks:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run pytest tests/acceptance/benchmarks
