name: dependency security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-security:
    runs-on: ubuntu-latest
    needs: [python, javascript]
    if: always()
    steps:
      - name: Require both dependency audits to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$NEEDS"

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - run: uv export --frozen --all-packages --all-groups --no-emit-workspace --no-hashes --output-file requirements-audit.txt
      - run: uvx pip-audit==2.10.0 --strict --disable-pip --no-deps --requirement requirements-audit.txt

  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun audit
