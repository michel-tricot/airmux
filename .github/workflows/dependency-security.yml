name: dependency security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
      - run: uv export --frozen --all-packages --all-groups --no-emit-workspace --no-hashes --output-file requirements-audit.txt
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements-audit.txt

  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun audit
