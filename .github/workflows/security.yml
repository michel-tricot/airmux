name: Security

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.event.pull_request.number || format('{0}-{1}', github.sha, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: true
          python-version: '3.13'
      - run: uv export --locked --all-packages --all-groups --no-emit-workspace --no-hashes --output-file requirements-audit.txt
      - run: uvx pip-audit==2.10.0 --strict --disable-pip --no-deps --requirement requirements-audit.txt

  bun-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun audit

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@284c089a1c4d8e8673b7398cdb8df358a9de47ad

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [pip-audit, bun-audit, dependency-review]
    if: always()
    steps:
      - name: Require audits and the available pull-request review
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -e --arg event "$GITHUB_EVENT_NAME" '
            ."pip-audit".result == "success" and
            ."bun-audit".result == "success" and
            (if $event == "pull_request" then
              ."dependency-review".result == "success"
            else
              ."dependency-review".result == "skipped" or ."dependency-review".result == "success"
            end)
          ' <<< "$NEEDS"
