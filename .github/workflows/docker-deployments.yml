name: docker-deployments

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-deployments-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker-correctness:
    runs-on: ubuntu-latest
    needs: [deployment]
    if: always()
    steps:
      - name: Require both Docker deployments to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$NEEDS"

  deployment:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compose-file: [docker-compose.yml, docker-compose.split.yml]
    env:
      DEPLOYMENT_PROJECT: airmux-test
      DEPLOYMENT_FILE: ${{ matrix.compose-file }}
      DEPLOYMENT_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.13'
      - run: uv sync --all-packages --locked
      - run: docker compose -p "$DEPLOYMENT_PROJECT" -f "$DEPLOYMENT_FILE" up -d --build --wait --wait-timeout 180
      - if: matrix.compose-file == 'docker-compose.yml'
        run: echo 'DEPLOYMENT_COMPACT_IMAGE=airmux:local' >> "$GITHUB_ENV"
      - if: matrix.compose-file == 'docker-compose.split.yml'
        run: echo 'DEPLOYMENT_GATEWAY_IMAGE=airmux-data-plane:local' >> "$GITHUB_ENV"
      - run: uv run --no-sync pytest tests/deployment
      - if: failure()
        run: docker compose -p "$DEPLOYMENT_PROJECT" -f "$DEPLOYMENT_FILE" logs --no-color
      - if: always()
        run: docker compose -p "$DEPLOYMENT_PROJECT" -f "$DEPLOYMENT_FILE" down -v
      - name: Verify workspace lockfile is unchanged
        if: always()
        run: git diff --exit-code -- uv.lock
