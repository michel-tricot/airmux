name: Deploy - Fly

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: Existing Fly app name
        required: true
        type: string
      region:
        description: App and volume region
        required: true
        type: string
      public_url:
        description: HTTPS origin for a custom domain; defaults to the app's fly.dev URL
        required: false
        type: string

concurrency:
  group: deploy-fly-${{ inputs.app_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.83
      - name: Deploy and update catalog
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP_NAME: ${{ inputs.app_name }}
          REGION: ${{ inputs.region }}
          PUBLIC_URL: ${{ inputs.public_url }}
        run: |
          test -n "$FLY_API_TOKEN" || { echo 'FLY_API_TOKEN is required' >&2; exit 1; }
          if [ -z "$PUBLIC_URL" ]; then PUBLIC_URL="https://${APP_NAME}.fly.dev"; fi
          fly deploy \
            --app "$APP_NAME" \
            --config deploy/fly/fly.toml \
            --primary-region "$REGION" \
            --env "AIRMUX_CONSOLE_URL=$PUBLIC_URL" \
            --ha=false
          fly ssh console --app "$APP_NAME" --user airmux --command "/app/deploy/docker/start.sh taxonomy"
          fly status --app "$APP_NAME"
          curl -fsS "$PUBLIC_URL/healthz"
