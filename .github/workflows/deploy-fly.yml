name: deploy-fly

on:
  workflow_dispatch:

concurrency:
  group: deploy-fly-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AIRLLM_PUBLIC_URL: ${{ vars.AIRLLM_PUBLIC_URL }}
      FLY_BACKEND_APP: ${{ vars.FLY_BACKEND_APP }}
      FLY_CONSOLE_APP: ${{ vars.FLY_CONSOLE_APP }}
      FLY_REGION: ${{ vars.FLY_REGION }}
    steps:
      - uses: actions/checkout@v6
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: ./deploy/fly/deploy.sh
        env:
          FLY_BACKEND_API_TOKEN: ${{ secrets.FLY_BACKEND_API_TOKEN }}
          FLY_CONSOLE_API_TOKEN: ${{ secrets.FLY_CONSOLE_API_TOKEN }}
      - run: ./deploy/fly/smoke.sh
