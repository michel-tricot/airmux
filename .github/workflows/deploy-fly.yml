name: deploy-fly

on:
  workflow_dispatch:

concurrency:
  group: deploy-fly-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      TOKKEEPER_PUBLIC_URL: ${{ vars.TOKKEEPER_PUBLIC_URL }}
      FLY_APP: ${{ vars.FLY_APP }}
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: >-
          flyctl deploy --config deploy/fly/fly.toml --app "$FLY_APP"
          --remote-only --ha=false
          --env "TOKKEEPER_CONSOLE_URL=${TOKKEEPER_PUBLIC_URL:-https://$FLY_APP.fly.dev}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - run: TOKKEEPER_PUBLIC_URL="${TOKKEEPER_PUBLIC_URL:-https://$FLY_APP.fly.dev}" ./deploy/smoke.sh
