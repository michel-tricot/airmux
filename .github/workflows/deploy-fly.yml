name: Deploy - Fly

on:
  workflow_dispatch:

concurrency:
  group: deploy-fly-${{ vars.FLY_APP_NAME }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.83
      - name: Deploy and update catalog
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP_NAME: ${{ vars.FLY_APP_NAME }}
          REGION: ${{ vars.FLY_REGION }}
          PUBLIC_URL: ${{ vars.AIRMUX_CONSOLE_URL }}
        run: |
          test -n "$FLY_API_TOKEN" || { echo 'FLY_API_TOKEN is required' >&2; exit 1; }
          test -n "$APP_NAME" || { echo 'FLY_APP_NAME is required' >&2; exit 1; }
          test -n "$REGION" || { echo 'FLY_REGION is required' >&2; exit 1; }
          if [ -z "$PUBLIC_URL" ]; then PUBLIC_URL="https://${APP_NAME}.fly.dev"; fi
          fly deploy \
            --app "$APP_NAME" \
            --config deploy/fly/fly.toml \
            --primary-region "$REGION" \
            --env "AIRMUX_CONSOLE_URL=$PUBLIC_URL" \
            --ha=false
          fly ssh console --app "$APP_NAME" --user airmux --command "/app/deploy/docker/start.sh taxonomy"
          fly status --app "$APP_NAME"
          curl -fsS "$PUBLIC_URL/healthz"
