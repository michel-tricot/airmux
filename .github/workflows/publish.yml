name: publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false
          python-version: '3.13'
      - name: Verify release source and version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          version="${RELEASE_TAG#v}"
          test "$RELEASE_TAG" = "v$version"
          test "$(uv version --short --project packaging/airmux --no-config)" = "$version"
      - run: uv sync --all-packages --frozen
      - name: Build release distributions
        run: ./scripts/build-python-distribution.sh
      - name: Rebuild wheels from source distributions
        run: |
          mkdir dist-from-sdist
          uv build --wheel --out-dir dist-from-sdist dist/airmux-*.tar.gz
      - name: Install rebuilt release
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/airmux-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/airmux-bin
        run: uv tool install dist-from-sdist/airmux-*.whl
      - name: Verify installed release
        env:
          AIRMUX_DISTRIBUTION_DIR: dist
          AIRMUX_INSTALL_BIN: ${{ runner.temp }}/airmux-bin/airmux
        run: uv run pytest tests/installation
      - name: Verify installed gateway
        env:
          AIRMUX_GATEWAY_BIN: ${{ runner.temp }}/airmux-bin/airmux
          DOCKER_HOST: unix:///no-docker.sock
        run: uv run pytest tests/acceptance/gateway
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-distributions
          path: dist/airmux*
          if-no-files-found: error

  live-providers:
    needs: build
    uses: ./.github/workflows/live-providers.yml
    with:
      ref: ${{ github.event.release.tag_name }}
      distribution-artifact: python-distributions
    permissions:
      contents: read

  publish:
    needs: [build, live-providers]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-distributions
          path: dist
      - uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027
      - run: uv publish --trusted-publishing always dist/*
