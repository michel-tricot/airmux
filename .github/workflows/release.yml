name: publish release

on:
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'michel-tricot/airmux' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
      artifact-id: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the current public version and main commit
        id: source
        run: |
          RELEASE_SHA="$GITHUB_SHA"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          version="$(python -c 'import tomllib; print(tomllib.load(open("packaging/airmux/pyproject.toml", "rb"))["project"]["version"])')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          RELEASE_TAG="v$version"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          fi
          {
            echo "sha=$RELEASE_SHA"
            echo "version=$version"
            echo "tag=$RELEASE_TAG"
            echo "candidate=candidate-${RELEASE_SHA}"
          } >> "$GITHUB_OUTPUT"
      - name: Require successful stable checks for the exact main commit
        id: checks
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        with:
          script: |
            const required = new Map([['ci.yml', 'required'], ['security.yml', 'dependency-security']]);
            for (const [filename, check] of required) {
              const {data: workflow} = await github.rest.actions.getWorkflow({...context.repo, workflow_id: filename});
              if (workflow.path !== `.github/workflows/${filename}` || workflow.state !== 'active') {
                throw new Error(`Untrusted or inactive workflow: ${filename}`);
              }
              const {data} = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: workflow.id, branch: 'main', event: 'push',
                head_sha: process.env.RELEASE_SHA, per_page: 1
              });
              const run = data.workflow_runs[0];
              if (!run || run.head_sha !== process.env.RELEASE_SHA || run.event !== 'push' || run.head_branch !== 'main' ||
                  run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                  run.status !== 'completed' || run.conclusion !== 'success') {
                throw new Error(`${filename} must succeed on main for ${process.env.RELEASE_SHA}`);
              }
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...context.repo, run_id: run.id});
              const gate = jobs.find(job => job.name === check);
              if (!gate || gate.status !== 'completed' || gate.conclusion !== 'success' || gate.head_sha !== process.env.RELEASE_SHA) {
                throw new Error(`${check} must succeed for ${process.env.RELEASE_SHA}`);
              }
              if (filename === 'ci.yml') core.setOutput('ci-run-id', run.id);
            }
      - name: Download the exact candidate produced by main CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ steps.source.outputs.candidate }}
          run-id: ${{ steps.checks.outputs.ci-run-id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify candidate digests
        env:
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          cd candidate
          sha256sum --check SHA256SUMS
          echo "Source commit: $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the verified release candidate in this run
        id: candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-candidate-${{ steps.source.outputs.sha }}
          path: candidate
          if-no-files-found: error
          retention-days: 30

  installation:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: ./.github/actions/setup-python
        with:
          cache: 'false'
      - uses: ./.github/actions/install-candidate
        with:
          artifact-id: ${{ needs.prepare.outputs.artifact-id }}
          no-cache: 'true'
      - run: uv run --no-sync pytest tests/installation/portable tests/installation/integration --junitxml=installation-results/installation.xml
      - name: Summarize installation results
        if: always()
        continue-on-error: true
        run: uv run --no-sync python tests/acceptance/gateway/ci_report.py installation-results --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload installation results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-installation-${{ needs.prepare.outputs.sha }}
          path: installation-results
          retention-days: 7

  live-providers:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: ./.github/actions/setup-python
        with:
          cache: 'false'
      - uses: ./.github/actions/install-candidate
        with:
          artifact-id: ${{ needs.prepare.outputs.artifact-id }}
          no-cache: 'true'
      - run: uv run --no-sync pytest tests/acceptance/live_providers --junitxml=provider-results/providers.xml
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIRMUX_GATEWAY_ARTIFACTS: ${{ runner.temp }}/provider-artifacts
          DOCKER_HOST: unix:///tmp/airmux-no-docker.sock
      - name: Summarize provider results
        if: always()
        continue-on-error: true
        run: uv run --no-sync python tests/acceptance/gateway/ci_report.py provider-results --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload provider results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-providers-${{ needs.prepare.outputs.sha }}
          path: |
            provider-results
            ${{ runner.temp }}/provider-artifacts
          retention-days: 7

  tag:
    needs: [prepare, installation, live-providers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Create the protected release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$RELEASE_SHA"
          fi

  publish:
    needs: [prepare, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: candidate
      - name: Verify candidate and isolate publishable distributions
        run: |
          cd candidate
          sha256sum --check SHA256SUMS
          mv SHA256SUMS "$RUNNER_TEMP/"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: candidate
          skip-existing: true

  verify-pypi:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: ./.github/actions/setup-python
        with:
          cache: 'false'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: candidate
      - name: Download the exact PyPI version and compare hashes
        run: uv run --no-sync python tests/installation/pypi_artifacts.py "${{ needs.prepare.outputs.version }}" candidate "$RUNNER_TEMP/pypi"
      - name: Install the verified PyPI wheel into an empty environment
        run: |
          uv export --locked --all-packages --all-groups --no-emit-workspace --no-hashes --output-file "$RUNNER_TEMP/constraints.txt"
          uv tool install --no-cache --constraints "$RUNNER_TEMP/constraints.txt" "$RUNNER_TEMP"/pypi/airmux-*.whl
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/pypi-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/pypi-bin
      - name: Send a real request through the verified gateway
        run: uv run --no-sync pytest tests/acceptance/gateway/test_01_basic.py::test_ready_gateway_completes_and_records_usage --junitxml=pypi-results/gateway.xml
        env:
          AIRMUX_GATEWAY_BIN: ${{ runner.temp }}/pypi-bin/airmux
          AIRMUX_GATEWAY_ARTIFACTS: ${{ runner.temp }}/pypi-artifacts
          DOCKER_HOST: unix:///tmp/airmux-no-docker.sock
      - name: Summarize PyPI verification
        if: always()
        continue-on-error: true
        run: uv run --no-sync python tests/acceptance/gateway/ci_report.py pypi-results --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload PyPI verification results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pypi-verification-${{ needs.prepare.outputs.sha }}
          path: |
            pypi-results
            ${{ runner.temp }}/pypi-artifacts
          retention-days: 7

  announce:
    needs: [prepare, verify-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Publish the verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          notes="Version: $VERSION
          Source commit: $RELEASE_SHA"
          gh release create "$RELEASE_TAG" --verify-tag --target "$RELEASE_SHA" --title "airmux $VERSION" --generate-notes --notes "$notes"
