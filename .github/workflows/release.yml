name: Publish Release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full SHA of the version commit on main
        required: true
        type: string

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Release prepare
    if: github.repository == 'michel-tricot/airmux' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
      ci-run-id: ${{ steps.checks.outputs.ci-run-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the requested version commit
        id: source
        env:
          RELEASE_SHA: ${{ inputs.commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$RELEASE_SHA" "$GITHUB_SHA"
          if git diff --quiet "$RELEASE_SHA^" "$RELEASE_SHA" -- VERSION; then
            echo "The requested commit must change VERSION" >&2
            exit 1
          fi
          version="$(git show "$RELEASE_SHA:VERSION")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          RELEASE_TAG="v$version"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "$RELEASE_TAG already exists; rerun failed jobs on its original release run" >&2
            exit 1
          fi
          {
            echo "sha=$RELEASE_SHA"
            echo "version=$version"
            echo "tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"
          printf 'Release candidate: %s from %s.\n' "$version" "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Require successful stable checks for the exact main commit
        id: checks
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        with:
          script: |
            const required = new Map([['main-ci.yml', 'Main CI required'], ['security.yml', 'dependency-security']]);
            for (const [filename, check] of required) {
              const {data: workflow} = await github.rest.actions.getWorkflow({...context.repo, workflow_id: filename});
              if (workflow.path !== `.github/workflows/${filename}` || workflow.state !== 'active') {
                throw new Error(`Untrusted or inactive workflow: ${filename}`);
              }
              const {data} = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: workflow.id, branch: 'main',
                head_sha: process.env.RELEASE_SHA, per_page: 20
              });
              const run = data.workflow_runs.find(run =>
                ['push', 'workflow_dispatch'].includes(run.event) && run.status === 'completed' &&
                run.conclusion === 'success' && run.head_sha === process.env.RELEASE_SHA &&
                run.head_branch === 'main' &&
                run.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}`
              );
              if (!run) throw new Error(`${filename} must succeed on main for ${process.env.RELEASE_SHA}`);
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...context.repo, run_id: run.id});
              const gate = jobs.find(job => job.name === check);
              if (!gate || gate.status !== 'completed' || gate.conclusion !== 'success' || gate.head_sha !== process.env.RELEASE_SHA) {
                throw new Error(`${check} must succeed for ${process.env.RELEASE_SHA}`);
              }
              if (filename === 'main-ci.yml') core.setOutput('ci-run-id', run.id);
            }

  installation:
    name: Release installation
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: ./.github/actions/setup-python
        with:
          cache: 'false'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: candidate-${{ needs.prepare.outputs.sha }}
          run-id: ${{ needs.prepare.outputs.ci-run-id }}
          github-token: ${{ github.token }}
          path: candidate
      - uses: ./.github/actions/install-candidate
        with:
          no-cache: 'true'
      - run: uv run --no-sync pytest tests/installation/portable tests/installation/integration --junitxml=installation-results/installation.xml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: container-${{ needs.prepare.outputs.sha }}
          run-id: ${{ needs.prepare.outputs.ci-run-id }}
          github-token: ${{ github.token }}
          path: container
      - name: Verify the candidate container before tagging
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          cd container
          sha256sum --check SHA256SUMS
          image="$(cat image)"
          [[ "$image" =~ ^ghcr\.io/michel-tricot/airmux@sha256:[0-9a-f]{64}$ ]]
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull "$image"
          test "$(docker run --rm --entrypoint airmux "$image" --version)" = "airmux $VERSION"
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$VERSION"
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$RELEASE_SHA"
      - name: Summarize installation results
        if: always()
        continue-on-error: true
        run: uv run --no-sync python tests/acceptance/gateway/ci_report.py installation-results --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload installation results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-installation-${{ needs.prepare.outputs.sha }}
          path: installation-results
          retention-days: 7

  live-providers:
    name: Release live-providers
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: ./.github/actions/setup-python
        with:
          cache: 'false'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: candidate-${{ needs.prepare.outputs.sha }}
          run-id: ${{ needs.prepare.outputs.ci-run-id }}
          github-token: ${{ github.token }}
          path: candidate
      - uses: ./.github/actions/install-candidate
        with:
          no-cache: 'true'
      - run: uv run --no-sync pytest tests/acceptance/live_providers --junitxml=provider-results/providers.xml
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIRMUX_GATEWAY_ARTIFACTS: ${{ runner.temp }}/provider-artifacts
          DOCKER_HOST: unix:///tmp/airmux-no-docker.sock
      - name: Summarize provider results
        if: always()
        continue-on-error: true
        run: uv run --no-sync python tests/acceptance/gateway/ci_report.py provider-results --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload provider results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-providers-${{ needs.prepare.outputs.sha }}
          path: |
            provider-results
            ${{ runner.temp }}/provider-artifacts
          retention-days: 7

  tag:
    name: Release tag
    needs: [prepare, installation, live-providers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Create the protected release tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          test -n "$GH_TOKEN"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$RELEASE_SHA"
          fi

  publish:
    name: Release publish
    needs: [prepare, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: candidate-${{ needs.prepare.outputs.sha }}
          run-id: ${{ needs.prepare.outputs.ci-run-id }}
          github-token: ${{ github.token }}
          path: candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: container-${{ needs.prepare.outputs.sha }}
          run-id: ${{ needs.prepare.outputs.ci-run-id }}
          github-token: ${{ github.token }}
          path: container
      - name: Verify candidate and isolate publishable distributions
        run: |
          cd candidate
          sha256sum --check SHA256SUMS
          mv SHA256SUMS "$RUNNER_TEMP/"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: candidate
          skip-existing: true
      - name: Publish the validated container image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/michel-tricot/airmux
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd container
          sha256sum --check SHA256SUMS
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          candidate="$(cat image)"
          [[ "$candidate" =~ ^ghcr\.io/michel-tricot/airmux@sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" "$candidate"
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"

  verify-pypi:
    name: Release verify-pypi
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: ./.github/actions/setup-python
        with:
          cache: 'false'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: candidate-${{ needs.prepare.outputs.sha }}
          run-id: ${{ needs.prepare.outputs.ci-run-id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Download the exact PyPI version and compare hashes
        run: uv run --no-sync python tests/installation/pypi_artifacts.py "${{ needs.prepare.outputs.version }}" candidate "$RUNNER_TEMP/pypi"
      - name: Install the verified PyPI wheel into an empty environment
        run: |
          uv export --locked --all-packages --all-groups --no-emit-workspace --no-hashes --output-file "$RUNNER_TEMP/constraints.txt"
          uv tool install --no-cache --constraints "$RUNNER_TEMP/constraints.txt" "$RUNNER_TEMP"/pypi/airmux-*.whl
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/pypi-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/pypi-bin
      - name: Send a real request through the verified gateway
        run: uv run --no-sync pytest tests/acceptance/gateway/test_01_basic.py::test_ready_gateway_completes_and_records_usage --junitxml=pypi-results/gateway.xml
        env:
          AIRMUX_GATEWAY_BIN: ${{ runner.temp }}/pypi-bin/airmux
          AIRMUX_GATEWAY_ARTIFACTS: ${{ runner.temp }}/pypi-artifacts
          DOCKER_HOST: unix:///tmp/airmux-no-docker.sock
      - name: Summarize PyPI verification
        if: always()
        continue-on-error: true
        run: uv run --no-sync python tests/acceptance/gateway/ci_report.py pypi-results --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload PyPI verification results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pypi-verification-${{ needs.prepare.outputs.sha }}
          path: |
            pypi-results
            ${{ runner.temp }}/pypi-artifacts
          retention-days: 7

  verify-container:
    name: Release verify-container
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.verify.outputs.image }}
    steps:
      - name: Pull and verify the published image
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.publish.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull "$IMAGE"
          test "$(docker run --rm --entrypoint airmux "$IMAGE" --version)" = "airmux $VERSION"
          test "$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$VERSION"
          test "$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$RELEASE_SHA"
          docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -e --arg digest "${IMAGE##*@}" '.digest == $digest'
          latest_digest="$(docker buildx imagetools inspect "ghcr.io/michel-tricot/airmux:latest" --format '{{json .Manifest}}' | jq -r .digest)"
          test "$latest_digest" = "${IMAGE##*@}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  announce:
    name: Release announce
    needs: [prepare, verify-pypi, verify-container]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Publish the verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.verify-container.outputs.image }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          notes="Version: $VERSION
          Source commit: $RELEASE_SHA
          Container: $IMAGE"
          python - <<'PY'
          import os
          from pathlib import Path

          compose = Path("docker-compose.yml").read_text()
          local_image = "${AIRMUX_IMAGE:-airmux:local}"
          assert compose.count(local_image) == 3
          release_image = "${AIRMUX_IMAGE:-" + os.environ["IMAGE"] + "}"
          (Path(os.environ["RUNNER_TEMP"]) / "docker-compose.yml").write_text(compose.replace(local_image, release_image))
          PY
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/docker-compose.yml" --verify-tag --target "$RELEASE_SHA" --title "airmux $VERSION" --generate-notes --notes "$notes"
