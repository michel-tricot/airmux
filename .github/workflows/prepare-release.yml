name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Public version increment
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true

concurrency:
  group: prepare-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-branch:
    if: github.repository == 'michel-tricot/airmux' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Prepare the public version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version="$(python - "$BUMP" <<'PY'
          from pathlib import Path
          import re
          import sys

          version_file = Path("VERSION")
          match = re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\n?", version_file.read_text())
          if match is None:
              raise SystemExit("VERSION must contain a stable major.minor.patch version")
          major, minor, patch = map(int, match.groups())
          match sys.argv[1]:
              case "major":
                  major, minor, patch = major + 1, 0, 0
              case "minor":
                  major, minor, patch = major, minor + 1, 0
              case "patch":
                  major, minor, patch = major, minor, patch + 1
              case _:
                  raise SystemExit("BUMP must be major, minor, or patch")
          version = f"{major}.{minor}.{patch}"
          version_file.write_text(f"{version}\n")
          print(version)
          PY
          )"
          test "$(git diff --name-only)" = "VERSION"
          test -z "$(git ls-files --others --exclude-standard)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "branch=release/v$version" >> "$GITHUB_OUTPUT"
      - name: Create the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.version.outputs.branch }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          version_file="VERSION"
          version_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$version_file?ref=$GITHUB_SHA" --jq .sha)"
          content="$(base64 -w 0 "$version_file")"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$RELEASE_BRANCH" -f sha="$GITHUB_SHA"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$version_file" -f message="Prepare airmux $RELEASE_VERSION" -f content="$content" -f branch="$RELEASE_BRANCH" -f sha="$version_sha"
          compare_url="https://github.com/$GITHUB_REPOSITORY/compare/main...$RELEASE_BRANCH?expand=1"
          {
            echo "Release branch \`$RELEASE_BRANCH\` is ready."
            echo "Open the prefilled pull request: $compare_url"
          } >> "$GITHUB_STEP_SUMMARY"
