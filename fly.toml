app = "airmux-example"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "release"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[mounts]
  source = "state"
  destination = "/state"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
