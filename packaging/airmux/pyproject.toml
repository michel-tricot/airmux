[project]
name = "airmux"
version = "0.1.2"
description = "Self-hosted LLM gateway and management CLI"
readme = "README.md"
license = "Elastic-2.0"
requires-python = ">=3.13"
dependencies = [
  "alembic",
  "anyio",
  "argon2-cffi>=23.1",
  "asyncpg",
  "fastapi",
  "httpx",
  "aiohttp>=3.14.3",
  "opentelemetry-exporter-otlp-proto-http",
  "opentelemetry-exporter-prometheus",
  "opentelemetry-sdk",
  "pydantic>=2",
  "uuid-utils>=1.0,<2",
  "prometheus-client",
  "python-dotenv",
  "pyyaml",
  "rich",
  "sqlalchemy[asyncio]>=2",
  "sqlmodel",
  "starlette",
  "tiktoken",
  "tomli-w>=1.2.0",
  "typer",
  "uvicorn[standard]>=0.52.1",
]

[project.urls]
Documentation = "https://github.com/michel-tricot/airmux/tree/main/docs"
Repository = "https://github.com/michel-tricot/airmux"
Issues = "https://github.com/michel-tricot/airmux/issues"

[project.scripts]
airmux = "cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/api_models",
  "src/airmux_runtime",
  "src/cli",
  "src/contract",
  "src/control_plane",
  "src/data_plane",
]
