meta:
  title: Unified model-catalog metadata schema
  generated: "2026-08-04"
  purpose: >
    A single model record shape that covers every piece of model metadata published by the
    two major model routers. Every field observed in either source maps to exactly one
    path in this schema; source-specific oddities that do not generalize land in
    pricing.extra / extra with their original field name preserved.
  sources:
    litellm:
      url: https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json
      models: 2987
      providers: 123
      distinct_fields: 152
      shape: flat dict per model, keyed by model name, all fields optional
    openrouter:
      urls:
        - https://openrouter.ai/api/v1/models
        - https://openrouter.ai/api/v1/providers
        - https://openrouter.ai/api/v1/models/{id}/endpoints
      models: 338
      hosting_providers: 101
      shape: nested objects (architecture, pricing, reasoning, benchmarks, endpoints)
  companion_files:
    - catalog-litellm.yml
    - catalog-openrouter.yml

schema:
  identity:
    id:
      type: str
      desc: canonical model identifier within the router
      from: {litellm: dict key, openrouter: id}
    canonical_slug:
      type: str
      desc: dated or versioned slug behind an alias id
      from: {openrouter: canonical_slug}
    name:
      type: str
      desc: human display name
      from: {openrouter: name}
    description:
      type: str
      from: {openrouter: description}
    provider:
      type: str
      desc: owning provider or upstream platform the router calls
      from: {litellm: litellm_provider, openrouter: id prefix (author)}
    hugging_face_id:
      type: str | null
      from: {openrouter: hugging_face_id}
    alias_target:
      type: "{name: str, slug: str} | null"
      desc: set when this id is a rolling alias for another record
      from: {openrouter: alias_target}
    source_url:
      type: str
      desc: where the router sourced the metadata (pricing page etc)
      from: {litellm: source}

  classification:
    mode:
      type: enum
      desc: primary task type of the model
      values: [chat, completion, responses, embedding, image_generation, image_edit,
               video_generation, audio_transcription, audio_speech, realtime, rerank,
               search, ocr, moderation, vector_store]
      from: {litellm: mode, openrouter: derived from architecture.modality}
    supported_endpoints:
      type: list[str]
      desc: API surfaces the model is reachable on
      values: [/v1/chat/completions, /v1/responses, /v1/batch, /v1/completions,
               /v1/messages, /v1/embeddings, /v1/images/generations, /v1/images/edits,
               /v1/images/variations, /v1/audio/transcriptions, /v1/audio/speech,
               /v1/realtime, /v1/ocr]
      from: {litellm: supported_endpoints}

  lifecycle:
    created_at:
      type: date
      from: {openrouter: created (unix epoch)}
    knowledge_cutoff:
      type: date
      from: {openrouter: knowledge_cutoff}
    deprecation_date:
      type: date
      from: {litellm: deprecation_date, openrouter: expiration_date}

  limits:
    context_window:
      type: int
      desc: max input tokens
      from: {litellm: max_input_tokens | max_tokens, openrouter: context_length}
    max_output_tokens:
      type: int
      from: {litellm: max_output_tokens, openrouter: top_provider.max_completion_tokens}
    rpm:
      type: int
      desc: default requests per minute the router allows
      from: {litellm: rpm}
    tpm:
      type: int
      from: {litellm: tpm}
    per_request_limits:
      type: object | null
      from: {openrouter: per_request_limits}
    supported_regions:
      type: list[str]
      from: {litellm: supported_regions}

  modalities:
    input:
      type: list[enum]
      values: [text, image, audio, video, file]
      from: {litellm: supported_modalities, openrouter: architecture.input_modalities}
    output:
      type: list[enum]
      values: [text, image, audio, embedding, video]
      from: {litellm: supported_output_modalities, openrouter: architecture.output_modalities}

  architecture:
    tokenizer:
      type: str
      from: {openrouter: architecture.tokenizer}
    instruct_type:
      type: str | null
      from: {openrouter: architecture.instruct_type}
    output_vector_size:
      type: int
      desc: embedding dimension, embedding models only
      from: {litellm: output_vector_size}

  capabilities:
    desc: >
      Boolean feature flags. LiteLLM publishes these directly as supports_*; OpenRouter
      implies most of them through supported_parameters and input_modalities.
    fields:
      function_calling: {from: {litellm: supports_function_calling, openrouter: "'tools' in supported_parameters"}}
      parallel_function_calling: {from: {litellm: supports_parallel_function_calling, openrouter: "'parallel_tool_calls' in supported_parameters"}}
      tool_choice: {from: {litellm: supports_tool_choice, openrouter: "'tool_choice' in supported_parameters"}}
      vision: {from: {litellm: supports_vision, openrouter: "'image' in input_modalities"}}
      pdf_input: {from: {litellm: supports_pdf_input, openrouter: "'file' in input_modalities"}}
      audio_input: {from: {litellm: supports_audio_input}}
      audio_output: {from: {litellm: supports_audio_output}}
      video_input: {from: {litellm: supports_video_input}}
      reasoning: {from: {litellm: supports_reasoning, openrouter: reasoning block present}}
      prompt_caching: {from: {litellm: supports_prompt_caching, openrouter: pricing.input_cache_read present}}
      response_schema: {from: {litellm: supports_response_schema, openrouter: "'response_format' in supported_parameters"}}
      native_structured_output: {from: {litellm: supports_native_structured_output, openrouter: "'structured_outputs' in supported_parameters"}}
      system_messages: {from: {litellm: supports_system_messages}}
      mid_conversation_system: {from: {litellm: supports_mid_conversation_system}}
      assistant_prefill: {from: {litellm: supports_assistant_prefill}}
      web_search: {from: {litellm: supports_web_search, openrouter: pricing.web_search present}}
      url_context: {from: {litellm: supports_url_context}}
      computer_use: {from: {litellm: supports_computer_use}}
      native_streaming: {from: {litellm: supports_native_streaming}}
      sampling_params: {from: {litellm: supports_sampling_params}}
      embedding_image_input: {from: {litellm: supports_embedding_image_input}}
      image_size: {from: {litellm: supports_image_size}}
      voice_cloning: {from: {openrouter: endpoint.supports_voice_cloning}}
      implicit_caching: {from: {openrouter: endpoint.supports_implicit_caching}}

  reasoning:
    desc: reasoning and effort configuration, only for reasoning-capable models
    fields:
      mandatory: {type: bool, from: {openrouter: reasoning.mandatory}}
      default_enabled: {type: bool, from: {openrouter: reasoning.default_enabled}}
      supported_efforts:
        type: list[enum]
        values: [none, minimal, low, medium, high, xhigh, max]
        from:
          openrouter: reasoning.supported_efforts
          litellm: supports_none_reasoning_effort, supports_minimal_reasoning_effort,
            supports_low_reasoning_effort, supports_max_reasoning_effort,
            supports_xhigh_reasoning_effort collapsed into one list
      default_effort: {type: str, from: {openrouter: reasoning.default_effort}}
      supports_reasoning_max_tokens: {type: bool, from: {openrouter: reasoning.supports_max_tokens}}
      adaptive_thinking: {type: bool, from: {litellm: supports_adaptive_thinking}}
      output_config:
        type: bool
        from: {litellm: supports_output_config, supports_parallel_tool_use_config, bedrock_output_config_effort_ceiling}

  generation:
    supported_parameters:
      type: list[enum]
      desc: request parameters the model accepts
      values: [max_tokens, max_completion_tokens, temperature, top_p, top_k, min_p, top_a,
               frequency_penalty, presence_penalty, repetition_penalty, stop, seed,
               logit_bias, logprobs, top_logprobs, response_format, structured_outputs,
               tools, tool_choice, parallel_tool_calls, reasoning, include_reasoning,
               reasoning_effort, verbosity, web_search_options, prediction]
      from: {openrouter: supported_parameters}
    defaults:
      type: dict[str, number]
      desc: router-applied default sampling values
      from: {openrouter: default_parameters}
    supported_voices:
      type: list[str] | null
      from: {openrouter: supported_voices}

  pricing:
    desc: >
      All amounts USD. Base unit is per token unless the key names another unit.
      This block generalizes ~70 LiteLLM cost fields: every above_<N>_tokens variant
      becomes a row in tiers, every _batches/_priority/_flex variant becomes a row in
      service_tiers, and every cache TTL variant lands under cache.
    per_token:
      input: {from: {litellm: input_cost_per_token, openrouter: pricing.prompt}}
      output: {from: {litellm: output_cost_per_token, openrouter: pricing.completion}}
      reasoning_output: {from: {litellm: output_cost_per_reasoning_token, openrouter: pricing.internal_reasoning}}
      audio_input: {from: {litellm: input_cost_per_audio_token, openrouter: pricing.audio}}
      audio_output: {from: {litellm: output_cost_per_audio_token, openrouter: pricing.audio_output}}
      image_input: {from: {litellm: input_cost_per_image_token}}
      image_output: {from: {litellm: output_cost_per_image_token, openrouter: pricing.image_output}}
      video_output: {from: {litellm: output_cost_per_video_token}}
      citation: {from: {litellm: citation_cost_per_token}}
    cache:
      read: {from: {litellm: cache_read_input_token_cost | input_cost_per_token_cache_hit, openrouter: pricing.input_cache_read}}
      write: {from: {litellm: cache_creation_input_token_cost, openrouter: pricing.input_cache_write}}
      write_1h: {from: {litellm: cache_creation_input_token_cost_above_1hr, openrouter: pricing.input_cache_write_1h}}
      audio_read: {from: {litellm: cache_read_input_audio_token_cost, openrouter: pricing.input_audio_cache}}
      audio_write: {from: {litellm: cache_creation_input_audio_token_cost}}
      min_tokens: {from: {litellm: prompt_cache_min_tokens}}
    tiers:
      type: list
      desc: >
        Long-context step pricing. One row per threshold; absorbs every
        *_above_{128k,200k,256k,272k,512k}_tokens field and litellm tiered_pricing lists.
      row: {over_tokens: int, input: num, output: num, cache_read: num, cache_write: num, cache_write_1h: num}
    service_tiers:
      type: dict
      desc: alternate processing classes priced separately from standard
      keys: [batch, priority, flex]
      row: {input: num, output: num, cache_read: num, audio_input: num, tiers: list}
      from: {litellm: "*_batches, *_priority, *_flex field families"}
    per_unit:
      desc: non-token billing units, mostly media and search models
      fields:
        image_input: {unit: image, from: {litellm: input_cost_per_image, openrouter: pricing.image}}
        image_output: {unit: image, from: {litellm: output_cost_per_image}}
        second_input: {unit: second, from: {litellm: input_cost_per_second}}
        second_output: {unit: second, from: {litellm: output_cost_per_second, output_cost_per_second_1080p}}
        audio_second_input: {unit: second, from: {litellm: input_cost_per_audio_per_second}}
        video_second_input: {unit: second, from: {litellm: input_cost_per_video_per_second}}
        video_second_output: {unit: second, from: {litellm: output_cost_per_video_per_second}}
        character_input: {unit: character, from: {litellm: input_cost_per_character}}
        character_output: {unit: character, from: {litellm: output_cost_per_character}}
        pixel_input: {unit: pixel, from: {litellm: input_cost_per_pixel}}
        pixel_output: {unit: pixel, from: {litellm: output_cost_per_pixel}}
        request: {unit: request, from: {litellm: input_cost_per_request}}
        query: {unit: query, from: {litellm: input_cost_per_query}}
        ocr_page: {unit: page, from: {litellm: ocr_cost_per_page, ocr_cost_per_credit}}
        annotation_page: {unit: page, from: {litellm: annotation_cost_per_page}}
        code_interpreter_session: {unit: session, from: {litellm: code_interpreter_cost_per_session}}
        dbu_input: {unit: databricks DBU, from: {litellm: input_dbu_cost_per_token}}
        dbu_output: {unit: databricks DBU, from: {litellm: output_dbu_cost_per_token}}
    web_search:
      per_query: {from: {openrouter: pricing.web_search}}
      by_context_size: {from: {litellm: search_context_cost_per_query}}
      billing_unit: {from: {litellm: web_search_billing_unit}}
    regional_multipliers:
      type: dict[region, num]
      from: {litellm: regional_processing_uplift_multiplier_eu, regional_processing_uplift_multiplier_us}
    discount:
      type: num
      from: {openrouter: endpoint.pricing.discount}
    overrides:
      type: list
      from: {openrouter: pricing.overrides}
    extra:
      type: dict
      desc: cost fields too provider-specific to generalize, original names preserved

  quality:
    artificial_analysis:
      fields: {intelligence_index: num, coding_index: num, agentic_index: num}
      from: {openrouter: benchmarks.artificial_analysis}
    design_arena:
      type: list
      row: {arena: str, category: str, elo: num, win_rate: num, rank: int}
      from: {openrouter: benchmarks.design_arena}

  deployments:
    desc: >
      Per hosting-provider endpoints serving this model. OpenRouter-specific concept;
      for LiteLLM the provider is baked into the model record instead.
    row:
      provider_name: str
      tag: str
      status: int
      quantization: {type: enum, values: [fp4, fp8, bf16, fp16, fp32, int4, int8, unknown]}
      context_length: int
      max_completion_tokens: int | null
      max_prompt_tokens: int | null
      is_moderated: bool
      supported_parameters: list[str]
      pricing: same shape as pricing block, endpoint-level overrides
      uptime: {last_5m: num, last_30m: num, last_1d: num}
      latency_last_30m: num | null
      throughput_last_30m: num | null
      supports_implicit_caching: bool
      supports_voice_cloning: bool
    from: {openrouter: "GET /api/v1/models/{id}/endpoints"}

  hosting_provider:
    desc: the org actually running inference, referenced by deployments
    fields:
      name: str
      slug: str
      headquarters: str | null
      datacenters: list[str] | null
      privacy_policy_url: str | null
      terms_of_service_url: str | null
      status_page_url: str | null
      moderated_by_router: bool
    from: {openrouter: /api/v1/providers}

  extra:
    type: dict
    desc: >
      Escape hatch for router- or provider-specific flags that do not generalize,
      original field names preserved. Observed occupants from litellm include
      use_openai_responses_path, gemini_native_audio, gemini_audio_only_live,
      bedrock_converse_supports_strict_tools, bedrock_output_config_effort_ceiling,
      supports_nova_canvas_image_edit, uses_embed_content, audio_transcription_config,
      provider_specific_entry, metadata.notes, rules

coverage_notes:
  - litellm is provider-centric, one record per provider x model, so the same model
    appears under many providers with different pricing; openrouter is model-centric
    with per-provider deployments hanging off one record
  - only litellm publishes capability booleans, deprecation dates, rate limits, batch,
    priority and flex tier pricing, and non-token billing units
  - only openrouter publishes descriptions, creation dates, knowledge cutoffs,
    tokenizer, default sampling parameters, benchmarks, per-endpoint quantization,
    uptime and moderation status, and hosting-provider legal metadata
  - both publish token pricing, cache pricing, context and output limits, modalities,
    and long-context tier pricing, so those anchor the shared core of the schema
