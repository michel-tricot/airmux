repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
      - id: ty
        name: ty check all projects
        entry: uv run ty check .
        language: system
        pass_filenames: false
      - id: lint-imports
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
      - id: openapi-drift
        name: committed OpenAPI spec matches the routes
        entry: bash -c './scripts/export-openapi.sh && git diff --exit-code lib/api-spec/openapi.yaml'
        language: system
        pass_filenames: false
      - id: api-models-drift
        name: generated API models match the OpenAPI spec
        entry: bash -c './scripts/generate-api-models.sh && git diff --exit-code lib/api-models'
        language: system
        pass_filenames: false
